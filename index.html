  // ❤️ Rabta: Load Profile Posts and Reels
window.rabtaLoadProfilePosts = async function(ownerUid, type){

  try {

    if(!ownerUid){
      throw new Error("Profile UID nahi mili.");
    }

    type = String(type || "post").toLowerCase();

    if(type !== "post" && type !== "reel"){
      throw new Error("Invalid content type.");
    }

    const collectionName =
      type === "reel" ? "reels" : "posts";

    const postsQuery =
      window.rabtaFirebaseQuery(
        window.rabtaFirebaseCollection(
          window.rabtaDB,
          collectionName
        ),
        window.rabtaFirebaseWhere(
          "ownerUid",
          "==",
          ownerUid
        )
      );

    const snapshot =
      await window.rabtaFirebaseGetDocs(postsQuery);

    const items = snapshot.docs.map(function(doc){

      return {
        id: doc.id,
        ...doc.data()
      };

    });

    // ❤️ Latest content first
    items.sort(function(a, b){
      return Number(b.createdAt || 0) -
             Number(a.createdAt || 0);
    });

    return items;

  } catch(error) {

    console.error(
      "Rabta Profile Posts Load Error:",
      error
    );

    alert(
      "Posts/Reels load nahi hui ❤️\n" +
      error.message
    );

    return [];

  }

};

    // ❤️ Rabta: Firebase se Highlight Groups + Old Highlights Load
window.rabtaLoadProfileHighlights = async function(ownerUid){

  try{

    if(!ownerUid){
      throw new Error("Profile UID nahi mili.");
    }

    const currentUser =
      window.rabtaAuth.currentUser;

    if(!currentUser){
      return [];
    }

    const isMyProfile =
      String(ownerUid) === String(currentUser.uid);

    // ❤️ Individual Highlights Load
    const highlightsRef =
      window.rabtaFirebaseCollection(
        window.rabtaDB,
        "storyHighlights"
      );

    const highlightsQuery =
      isMyProfile
      ?
      window.rabtaFirebaseQuery(
        highlightsRef,
        window.rabtaFirebaseWhere(
          "ownerUid",
          "==",
          ownerUid
        )
      )
      :
      window.rabtaFirebaseQuery(
        highlightsRef,
        window.rabtaFirebaseWhere(
          "ownerUid",
          "==",
          ownerUid
        ),
        window.rabtaFirebaseWhere(
          "audience",
          "==",
          "public"
        )
      );

    const highlightsSnapshot =
      await window.rabtaFirebaseGetDocs(
        highlightsQuery
      );

    const highlights =
      highlightsSnapshot.docs.map(function(doc){

        return {
          id: doc.id,
          ...doc.data()
        };

      });

    // ❤️ Highlight Groups Load
    const groupsRef =
      window.rabtaFirebaseCollection(
        window.rabtaDB,
        "storyHighlightGroups"
      );

    const groupsQuery =
      isMyProfile
      ?
      window.rabtaFirebaseQuery(
        groupsRef,
        window.rabtaFirebaseWhere(
          "ownerUid",
          "==",
          ownerUid
        )
      )
      :
      window.rabtaFirebaseQuery(
        groupsRef,
        window.rabtaFirebaseWhere(
          "ownerUid",
          "==",
          ownerUid
        ),
        window.rabtaFirebaseWhere(
          "audience",
          "==",
          "public"
        )
      );

    const groupsSnapshot =
      await window.rabtaFirebaseGetDocs(
        groupsQuery
      );

    const profileItems = [];

    // ❤️ Har Group ke andar uski Stories
    groupsSnapshot.forEach(function(doc){

      const group = doc.data();

      const groupStories =
        highlights.filter(function(story){

          return story.groupId === doc.id;

        });

      // ❤️ Stories ko original posting time ke hisaab se sort karo
      groupStories.sort(function(a,b){

        return Number(a.originalCreatedAt || 0) -
               Number(b.originalCreatedAt || 0);

      });

      if(groupStories.length === 0){
        return;
      }

      profileItems.push({

        id: doc.id,

        isGroup: true,

        groupName: group.groupName || "Highlight",

        coverUrl:
          group.coverUrl ||
          groupStories[0].mediaUrl ||
          "",

        coverType:
          group.coverType ||
          groupStories[0].type ||
          "image",

        stories: groupStories,

        mediaUrl:
          group.coverUrl ||
          groupStories[0].mediaUrl ||
          "",

        type:
          group.coverType ||
          groupStories[0].type ||
          "image",

        highlightedAt:
          Number(group.updatedAt || group.createdAt || 0)

      });

    });

    // ❤️ Purane Individual Highlights safe rakho
    highlights.forEach(function(story){

      if(!story.groupId){

        profileItems.push({

          ...story,

          isGroup: false,

          groupName: "Highlight",

          coverUrl: story.mediaUrl || ""

        });

      }

    });

    // ❤️ Latest Groups first
    profileItems.sort(function(a,b){

      return Number(b.highlightedAt || 0) -
             Number(a.highlightedAt || 0);

    });

    // ❤️ Profile Viewer Cache
    if(!window.rabtaProfileHighlightsCache){
      window.rabtaProfileHighlightsCache = {};
    }

    window.rabtaProfileHighlightsCache[String(ownerUid)] =
      profileItems;

    console.log(
      "Rabta Profile Highlight Groups Loaded:",
      ownerUid,
      profileItems
    );

    return profileItems;

  }catch(error){

    console.error(
      "Rabta Profile Highlights Load Error:",
      error
    );

    return [];

  }

};

// ❤️ Rabta Instagram Style Profile Highlight Viewer
window.rabtaOpenProfileHighlight = function(ownerUid, index){

  const items =
    window.rabtaProfileHighlightsCache?.[String(ownerUid)] || [];

  if(!items.length || !items[index]){
    alert("Highlight abhi load nahi hua.");
    return;
  }

  window.rabtaProfileHighlightOwner = ownerUid;
  window.rabtaProfileHighlightIndex = index;
  window.rabtaProfileHighlightStoryIndex = 0;

  function escapeHTML(value){

    return String(value || "").replace(/[&<>"']/g, function(char){

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[char];

    });

  }

  function getStories(item){

    if(item.isGroup && Array.isArray(item.stories)){
      return item.stories;
    }

    return [item];

  }

  function getTime(value){

    if(value && typeof value.toDate === "function"){
      value = value.toDate();
    }

    const date = new Date(
      typeof value === "number" ? value : value
    );

    if(isNaN(date.getTime())){
      return "";
    }

    return date.toLocaleString([], {
      day:"numeric",
      month:"short",
      hour:"2-digit",
      minute:"2-digit"
    });

  }

  function renderHighlight(){

    const currentItems =
      window.rabtaProfileHighlightsCache[
        String(window.rabtaProfileHighlightOwner)
      ] || [];

    const currentIndex =
      window.rabtaProfileHighlightIndex;

    const item = currentItems[currentIndex];

    if(!item) return;

    const stories = getStories(item);

    const storyIndex =

window.rabtaProfileHighlightPrevious = function(){

  const items =
    window.rabtaProfileHighlightsCache[
      String(window.rabtaProfileHighlightOwner)
    ] || [];

  const group =
    items[window.rabtaProfileHighlightIndex];

  if(!group) return;

  const stories =
    group.isGroup && Array.isArray(group.stories)
    ? group.stories
    : [group];

  if(window.rabtaProfileHighlightStoryIndex > 0){

    window.rabtaProfileHighlightStoryIndex--;

  }else if(window.rabtaProfileHighlightIndex > 0){

    window.rabtaProfileHighlightIndex--;

    const previousGroup =
      items[window.rabtaProfileHighlightIndex];

    const previousStories =
      previousGroup.isGroup &&
      Array.isArray(previousGroup.stories)
      ? previousGroup.stories
      : [previousGroup];

    window.rabtaProfileHighlightStoryIndex =
      previousStories.length - 1;

  }

  window.rabtaRenderProfileHighlight();

};


// ❤️ Next Story / Next Group
window.rabtaProfileHighlightNext = function(){

  const items =
    window.rabtaProfileHighlightsCache[
      String(window.rabtaProfileHighlightOwner)
    ] || [];

  const group =
    items[window.rabtaProfileHighlightIndex];

  if(!group) return;

  const stories =
    group.isGroup && Array.isArray(group.stories)
    ? group.stories
    : [group];

  if(
    window.rabtaProfileHighlightStoryIndex <
    stories.length - 1
  ){

    window.rabtaProfileHighlightStoryIndex++;

    window.rabtaRenderProfileHighlight();

    return;

  }

  // ❤️ Group ki aakhri Story:

    window.rabtaProfileHighlightIndex++;

    window.rabtaProfileHighlightStoryIndex = 0;

    window.rabtaRenderProfileHighlight();

  // Viewer band karke Profile par wapas

    document.getElementById(
      "rabtaProfileHighlightViewer"
    );

  if(viewer){
    viewer.remove();
  }

};




  // ❤️ Rabta: Smart Reel Navigation Refresh

window.rabtaOpenReels = async function(){

  try {

    // ❤️ Firebase se fresh Reels load
    const reels =
      await window.rabtaLoadPublicReels();

    if(!reels || reels.length === 0){
      alert("Abhi koi Reel available nahi hai ❤️");
      return;
    }

    // ❤️ Sirf Valid Video Reels
    const videoReels = reels.filter(function(reel){

      return (
        reel &&
        reel.id &&
        reel.mediaUrl &&
        (
          reel.mediaType === "video" ||
          reel.resourceType === "video"
        )
      );

    });

    if(videoReels.length === 0){
      alert("Abhi koi Video Reel available nahi hai ❤️");
      return;
    }

    const storageKey =
      "rabtaLastNavigationReel";

    const lastData = JSON.parse(
      localStorage.getItem(storageKey) || "{}"
    );

    const lastReelId =
      lastData.lastReelId || "";

    const lastOpenedAt =
      Number(lastData.lastOpenedAt || 0);

    // ❤️ Latest uploaded Reel check
    const newReels = videoReels
      .filter(function(reel){

        const created =
          Number(reel.createdAt || 0);

        return created > lastOpenedAt;

      })
      .sort(function(a, b){

        return Number(b.createdAt || 0) -
               Number(a.createdAt || 0);

      });

    let selectedReel = null;

    // ❤️ New Reel available: latest first
    if(newReels.length > 0){

      selectedReel = newReels[0];

    } else {

      // ❤️ Otherwise select a different Reel
      const lastIndex =
        videoReels.findIndex(function(reel){
          return reel.id === lastReelId;
        });

      if(lastIndex >= 0){

        selectedReel =
          videoReels[
            (lastIndex + 1) % videoReels.length
          ];

      } else {

        // ❤️ First Navigation: Latest Reel
        selectedReel = videoReels.slice().sort(
          function(a, b){
            return Number(b.createdAt || 0) -
                   Number(a.createdAt || 0);
          }
        )[0];

      }

    }

    // ❤️ Selected Reel ko list ke first position par rakho
    const selectedIndex =
      videoReels.findIndex(function(reel){
        return reel.id === selectedReel.id;
      });

    const navigationList = [
      ...videoReels.slice(selectedIndex),
      ...videoReels.slice(0, selectedIndex)
    ];

    window.rabtaCurrentReelList =
      navigationList;

    window.rabtaCurrentReelIndex = 0;

    // ❤️ Save last opened Reel
    localStorage.setItem(
      storageKey,
      JSON.stringify({
        lastReelId: selectedReel.id,
        lastOpenedAt: Date.now()
      })
    );

    // ❤️ Open selected Reel
    window.rabtaOpenReelViewer(selectedReel);

  } catch(error) {

    console.error(
      "Rabta Reels Navigation Error:",
      error
    );

    alert(
      "Reels Navigation nahi khuli: " +
      error.message
    );

  }

};

window.rabtaUploadStoryMedia = async function(file, mediaType){

  try {

    const user = window.rabtaAuth.currentUser;

    if (!user) {
      throw new Error("Pehle Rabta mein login karo.");
    }

    if (!file) {
      throw new Error("Story media file nahi mili.");
    }

    const safeName = String(file.name || "story_media")
      .replace(/[^a-zA-Z0-9._-]/g, "_");

    const storagePath =
      "stories/" +
      user.uid + "/" +
      Date.now() + "_" +
      Math.random().toString(36).slice(2) + "_" +
      safeName;

    const storageRef = window.rabtaFirebaseRef(
      window.rabtaStorage,
      storagePath
    );

    const uploadResult =
      await window.rabtaFirebaseUploadBytes(
        storageRef,
        file,
        {
        
          contentType: file.type || "application/octet-stream",
          customMetadata: {
            ownerUid: user.uid,
            mediaType: String(mediaType || "image")
          }
        }
      );
    const downloadURL =
      await window.rabtaFirebaseGetDownloadURL(
        uploadResult.ref
      );

    return {
      downloadURL: downloadURL,
      storagePath: storagePath,
      mediaType: String(mediaType || "image"),
      fileName: safeName,
      createdAt: Date.now()
    };

  } catch (error) {

    console.error("Rabta Story Upload Error:", error);

    throw error;

  }

};

  // ❤️ Rabta: Connection Statuses — Firebase Only
window.rabtaLoadMyConnectionStatuses = async function(){

  const user = window.rabtaAuth?.currentUser;

  if(!user){
    return {};
  }

  try{

    // ❤️ Sent requests query
    const sentQuery = window.rabtaFirebaseQuery(
      window.rabtaFirebaseCollection(
        window.rabtaDB,
        "connectionRequests"
      ),
      window.rabtaFirebaseWhere(
        "senderUid",
        "==",
        user.uid
      )
    );

    // ❤️ Received requests query
    const receivedQuery = window.rabtaFirebaseQuery(
      window.rabtaFirebaseCollection(
        window.rabtaDB,
        "connectionRequests"
      ),
      window.rabtaFirebaseWhere(
        "receiverUid",
        "==",
        user.uid
      )
    );

    // ❤️ Firebase se requests load
    const sentSnapshot =
      await window.rabtaFirebaseGetDocs(sentQuery);

    const receivedSnapshot =
      await window.rabtaFirebaseGetDocs(receivedQuery);

    const statuses = {};

    // ❤️ Current user ne jo requests bheji hain
    sentSnapshot.docs.forEach(function(requestDoc){

      const data = requestDoc.data();

      if(data.receiverUid){
        statuses[data.receiverUid] = data.status;
      }

    });

    // ❤️ Current user ko jo requests mili hain
    receivedSnapshot.docs.forEach(function(requestDoc){

      const data = requestDoc.data();
      const senderUid = data.senderUid;

      if(!senderUid) return;

      if(data.status === "confirmed"){

        if(statuses[senderUid] === "confirmed"){
          statuses[senderUid] = "confirmed";
        }

        else if(statuses[senderUid] === "pending"){
          statuses[senderUid] = "pending";
        }

        else{
          statuses[senderUid] = "addBack";
        }

      }else if(!statuses[senderUid]){

        statuses[senderUid] = data.status;

      }

    });

    return statuses;

  }catch(error){

    console.error("Rabta Status Error:", error);

    alert(
      "Bhai, Firebase status load nahi hua ❤️\n" +
      error.code
    );

    return {};

  }

};

    const addedYouQuery = window.rabtaFirebaseQuery(
      window.rabtaFirebaseCollection(db, "connectionRequests"),
      window.rabtaFirebaseWhere("receiverUid", "==", targetUid),
      window.rabtaFirebaseWhere("status", "==", "confirmed")
    );

    // ❤️ Jinko target user ne add kiya
    const addedQuery = window.rabtaFirebaseQuery(
      window.rabtaFirebaseCollection(db, "connectionRequests"),
      window.rabtaFirebaseWhere("senderUid", "==", targetUid),
      window.rabtaFirebaseWhere("status", "==", "confirmed")
    );

    const [addedYouSnapshot, addedSnapshot] =
      await Promise.all([
        window.rabtaFirebaseGetDocs(addedYouQuery),
        window.rabtaFirebaseGetDocs(addedQuery)
      ]);

    // ❤️ Firebase se public profile load
    async function loadPerson(uid){

      if(!uid){
        return null;
      }

      const profileSnapshot =
        await window.rabtaFirebaseGetDoc(
          window.rabtaFirebaseDoc(
            db,
            "publicProfiles",
            uid
          )
        );

      if(!profileSnapshot.exists()){
        return {
          uid: uid,
          name: "Rabta User",
          photo: ""
        };
      }

      const data = profileSnapshot.data();

      return {
        uid: uid,
        name: data.name || "Rabta User",
        age: data.age || "",
        city: data.city || "",
        bio: data.bio || "",
        interests: data.interests || "",
        gender: data.gender || "",
        lookingFor: data.lookingFor || "",
        vibes: Array.isArray(data.vibes) ? data.vibes : [],
        photo:
          data.photo ||
          data.profilePhoto ||
          data.photoURL ||
          ""
      };

    }

    const addedYou = await Promise.all(
      addedYouSnapshot.docs.map(async function(requestDoc){

        const data = requestDoc.data();

        return await loadPerson(data.senderUid);

      })
    );

    const added = await Promise.all(
      addedSnapshot.docs.map(async function(requestDoc){

        const data = requestDoc.data();

        return await loadPerson(data.receiverUid);

      })
    );

    return {
      addedYou: addedYou.filter(Boolean),
      added: added.filter(Boolean)
    };

  }catch(error){

    console.error(
      "Rabta Profile Connections Error:",
      error
    );

    alert(
      "Profile connections load nahi hui ❤️\n" +
      error.message
    );

    return {
      addedYou: [],
      added: []
    };

  }

};

window.rabtaHandleFirebaseIncoming = async function(
  requestId,
  status,
  name
){

  const user = window.rabtaAuth?.currentUser;

  if(!user){
    alert("Bhai, pehle Rabta mein login karo ❤️");
    return;
  }

  if(status !== "confirmed" && status !== "rejected"){
    alert("Bhai, request status sahi nahi hai.");
    return;
  }

  if(!requestId || !requestId.includes("_")){
    alert("Bhai, request ID sahi nahi mili.");
    return;
  }

  try{

    const requestRef = window.rabtaFirebaseDoc(
      window.rabtaDB,
      "connectionRequests",
      requestId
    );

    // ❤️ Firebase request read
    const requestSnapshot =
      await window.rabtaFirebaseGetDoc(requestRef);

    if(!requestSnapshot.exists()){
      alert("Bhai, Firebase mein request nahi mili ❤️");
      return;
    }

    const requestData = requestSnapshot.data();

    if(requestData.receiverUid !== user.uid){
      alert("Bhai, ye request doosri ID ke liye hai.");
      return;
    }

    if(requestData.status !== "pending"){
      alert("Bhai, is request ka status pehle hi badal chuka hai.");
      await rabtaConnectionRequests();
      return;
    }

    // ❤️ Firebase status update
    await window.rabtaFirebaseSetDoc(
      requestRef,
      { status: status },
      { merge: true }
    );

// ❤️ Firebase Confirm / Reject
if(status === "confirmed"){

  // ❤️ Connection Firebase mein confirmed ho chuka hai

  // ❤️ Request bhejne wale ko confirmation notification
await window.rabtaSaveConnectionNotification(
  requestData.senderUid,
  "connection_confirmed",
  requestId
);
  
  window.rabtaConnectionStatuses =
    await window.rabtaLoadMyConnectionStatuses();

  // ❤️ Discover data refresh
  window.rabtaCloudProfiles = null;

  alert("❤️ Connection request confirm ho gayi!");

}else{

  alert("Request reject ho gayi ❤️");

}

    await rabtaConnectionRequests();

  }catch(error){

    console.error(
      "Rabta Confirm/Reject Error:",
      error
    );

    alert(
      "Firebase Error: " +
      error.code +
      "\n" +
      error.message
    );

  }

};

// ❤️ Rabta Add Back — Public / Private Account
window.rabtaAddBackFirebaseConnection = async function(otherUid){

  const user = window.rabtaAuth?.currentUser;

  if(!user){
    alert("Pehle Rabta mein login karo ❤️");
    return false;
  }

  if(!otherUid || otherUid === user.uid){
    return false;
  }

  try{

    // ❤️ Jis user ko Add Back kar rahe hain uski profile
    const profileRef = window.rabtaFirebaseDoc(
      window.rabtaDB,
      "publicProfiles",
      otherUid
    );

    const profileSnapshot =
      await window.rabtaFirebaseGetDoc(profileRef);

    if(!profileSnapshot.exists()){
      alert("User ki profile nahi mili ❤️");
      return false;
    }

    const profileData = profileSnapshot.data();

    // ❤️ Private / Public check
    const visibility = profileData.profileVisible;

    const isPrivate =
      visibility === false ||
      visibility === "off";

    const requestStatus =
      isPrivate ? "pending" : "confirmed";

    const requestId = user.uid + "_" + otherUid;

    const requestRef = window.rabtaFirebaseDoc(
      window.rabtaDB,
      "connectionRequests",
      requestId
    );

    const existing =
      await window.rabtaFirebaseGetDoc(requestRef);

    if(existing.exists()){

      const data = existing.data();

      if(data.status === "confirmed"){
        return true;
      }

      alert("Connection request pehle se pending hai ❤️");
      return false;
    }

    // ❤️ Firebase mein connection save
    await window.rabtaFirebaseSetDoc(requestRef, {

      senderUid: user.uid,
      receiverUid: otherUid,
      status: requestStatus,
      createdAt: new Date().toISOString()

    });

    // ❤️ Add Back Connection Notification
await window.rabtaSaveConnectionNotification(
  otherUid,
  isPrivate ? "connection_request" : "connection_added",
  requestId
);
  
    if(isPrivate){
      alert("❤️ Private account ko Add Back request bhej di!");
    }

    return true;

  }catch(error){

    console.error("Rabta Add Back Error:", error);

    alert("Add Back nahi hua: " + error.message);

    return false;

  }

};
  
   // ❤️ Rabta Profile Add / Add Back Action
window.rabtaProfileConnectionAction = async function(otherUid, button){

  if(!otherUid || !button) return;

  const user = window.rabtaAuth.currentUser;

  if(!user){
    alert("Pehle Rabta mein login karo ❤️");
    return;
  }

  try{

    button.disabled = true;
    button.innerText = "Please wait...";

    const statuses =
      await window.rabtaLoadMyConnectionStatuses();

    const status = statuses[otherUid] || "";

    let success = false;

    if(status === "confirmed"){
      button.innerText = "❤️ Added";
      return;
    }

    if(status === "pending"){
      button.innerText = "⏳ Requested";
      return;
    }

    if(status === "addBack"){

      success =
        await window.rabtaAddBackFirebaseConnection(otherUid);

    }else{

      success =
        await window.rabtaSendFirebaseConnectionRequest(otherUid);

    }

    if(!success){
      button.innerText =
        status === "addBack" ? "💞 Add Back" : "❤️ Add";
      return;
    }

    const updatedStatuses =
      await window.rabtaLoadMyConnectionStatuses();

    const updatedStatus =
      updatedStatuses[otherUid] || "";

    button.innerText =
      updatedStatus === "confirmed" ? "❤️ Added" :
      updatedStatus === "pending" ? "⏳ Requested" :
      updatedStatus === "addBack" ? "💞 Add Back" :
      "❤️ Add";

  }catch(error){

    console.error("Rabta Profile Connection Error:", error);

    alert("Connection update nahi hua: " + error.message);

    button.innerText = "❤️ Add";

  }finally{

    button.disabled = false;

  }

};

window.rabtaLoadNotificationsFromFirebase = async function(){

  try {

    const user = window.rabtaAuth.currentUser;

    if(!user){
      return [];
    }

    const notificationsRef =
      window.rabtaFirebaseCollection(
        window.rabtaDB,
        "notifications"
      );

    const notificationsQuery =
      window.rabtaFirebaseQuery(
        notificationsRef,
        window.rabtaFirebaseWhere(
          "recipientUid",
          "==",
          user.uid
        )
      );

    const snapshot =
      await window.rabtaFirebaseGetDocs(
        notificationsQuery
      );

    const notifications = snapshot.docs.map(function(doc){

      return {
        id: doc.id,
        ...doc.data()
      };

    });

    // ❤️ Newest Notification First
    notifications.sort(function(a, b){

      return Number(b.createdAt || 0) -
             Number(a.createdAt || 0);

    });

    return notifications;

  } catch(error) {

    console.error(
      "Rabta Notification Load Error:",
      error
    );

    alert("Notifications load nahi hui: " + error.message);

    return [];

  }
  }

// ❤️ 1 Second Press
card.addEventListener("pointerdown", function(){

  longPressTriggered = false;

  longPressTimer = setTimeout(function(){

    longPressTriggered = true;
    deleteButton.style.display = "block";

  }, 1000);

});

card.addEventListener("pointerup", function(){
  clearTimeout(longPressTimer);
});

card.addEventListener("pointerleave", function(){
  clearTimeout(longPressTimer);
});

card.addEventListener("pointercancel", function(){
  clearTimeout(longPressTimer);
});

// ❤️ Delete Notification
deleteButton.onclick = async function(event){

  event.stopPropagation();

  try {

    if(!confirm("Ye notification delete karni hai?")){
      return;
    }

    const notificationRef = window.rabtaFirebaseDoc(
      window.rabtaDB,
      "notifications",
      item.id
    );

    await window.rabtaFirebaseDeleteDoc(notificationRef);

    card.remove();

    if(!list.querySelector("div")){
      list.innerHTML = `
        <p style="text-align:center;color:#999;padding:25px;">
          No notifications yet ❤️
        </p>
      `;
    }

  } catch(error) {

    console.error("Notification Delete Error:", error);

    alert("Notification delete nahi hui: " + error.message);

  }

};
    
   // ❤️ Notification Tap
card.onclick = async function(){

  try {

    // ❤️ Connection notification par actor ki profile kholo
    if(item.contentType === "connection"){

      screen.remove();

      if(typeof window.rabtaViewCloudProfile === "function"){

        window.rabtaViewCloudProfile(item.actorUid);

      }else{

        alert("Profile open karne wala function nahi mila ❤️");

      }

      return;
    }

    // ❤️ Purana Post / Reel notification behavior
    const collectionName =
      item.contentType === "reel"
        ? "reels"
        : "posts";

    const contentRef = window.rabtaFirebaseDoc(
      window.rabtaDB,
      collectionName,
      item.contentId
    );

    const contentSnap =
      await window.rabtaFirebaseGetDoc(contentRef);

    if(!contentSnap.exists()){
      alert("Post/Reel ab available nahi hai.");
      return;
    }

    const contentItem = {
      id: contentSnap.id,
      ...contentSnap.data()
    };

    screen.remove();

    if(item.contentType === "reel"){

      if(window.rabtaOpenReelViewer){
        window.rabtaOpenReelViewer(contentItem);
      }

    }else{

      if(window.rabtaOpenPostViewer){
        window.rabtaOpenPostViewer(contentItem);
      }

    }

  }catch(error){

    console.error("Notification Open Error:", error);

    alert("Notification open nahi hui: " + error.message);

  }

};
    list.appendChild(card);

  });

};
  
</script>
