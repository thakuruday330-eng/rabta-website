  // ❤️ Rabta Instagram Style Swipe Right Reply

window.rabtaChatSwipeState = null;

window.rabtaChatSwipeStart = function(event, name, area){

  if(event.target.closest("button,input,textarea")){
    return;
  }

  let child = event.target;

  while(child && child.parentElement !== area){
    child = child.parentElement;
  }

  if(!child) return;

  const childIndex = Array.from(area.children).indexOf(child);

  // Pehla child greeting hai
  const messageIndex = childIndex - 1;

  if(messageIndex < 0) return;

  window.rabtaChatSwipeState = {
    name: name,
    startX: event.clientX,
    startY: event.clientY,
    messageIndex: messageIndex,
    triggered: false
  };

};

window.rabtaChatSwipeMove = function(event, name, area){

  const state = window.rabtaChatSwipeState;

  if(!state || state.name !== name) return;

  const diffX = event.clientX - state.startX;
  const diffY = Math.abs(event.clientY - state.startY);

  if(
    diffX > 70 &&
    diffY < 45 &&
    !state.triggered
  ){

    state.triggered = true;

    // Long press timer cancel
    if(window.rabtaChatUniversalHoldCancel){
      window.rabtaChatUniversalHoldCancel(area);
    }

  }

};

window.rabtaChatSwipeEnd = function(event, name, area){

  const state = window.rabtaChatSwipeState;

  if(!state || state.name !== name) return;

  if(state.triggered){

    setReplyMessage(
      state.name,
      state.messageIndex
    );

  }

  window.rabtaChatSwipeState = null;

};

  // ❤️ Rabta: Hide Bottom Navigation During Chat

const rabtaChatNav = document.querySelector(".nav");

if(rabtaChatNav){
  rabtaChatNav.style.setProperty("display","none","important");
}

// ❤️ Hide Rabta Main Header During Chat

const rabtaMainHeader =
  document.getElementById("rabtaMainHeader");

if(rabtaMainHeader){

    "display",
    "none",
    "important"
  );
}
  
  window.rabtaStoryReturnChatName = name;

  // ❤️ Rabta Chat Physical Back History
if(!window.rabtaChatBackEntryActive){

  history.pushState(
    { rabtaChat: true },
    ""
  );

  window.rabtaChatBackEntryActive = true;

  }
  
  // ❤️ Rabta: Show Loading Only When Opening New Chat

if(window.rabtaChatCurrentScreenName !== name){

  window.rabtaChatCurrentScreenName = name;

  document.getElementById("app").innerHTML = `

  ">

    <div style="

      font-size:15px;
      font-weight:bold;
    ">
      Opening Chat...
    </div>
  </div>
  `;

}
  
// Firebase Original Profile
let cloudProfiles = [];

await window.rabtaLoadPublicProfiles();

cloudProfiles = window.rabtaCloudProfiles || [];

let p = cloudProfiles.find(function(x){
  return x.name === name;
});

// ❤️ Firebase Activity Status

if(!p){
  alert("Profile nahi mili ❤️");
  return;
}

let chatStatus = "Checking...";
let lastSeenText = "Checking activity...";
let statusColor = "#888";
  

  
// ❤️ Rabta: Start Chat Without Old Local Messages
let chatMessages =
JSON.parse(localStorage.getItem("chat_" + name) || "[]");

localStorage.removeItem("unread_" + name);

  // ❤️ Rabta Firebase Live Chat Listener

const currentUser = window.rabtaAuth.currentUser;


  
if(currentUser && p.uid){

  const participants = [
    currentUser.uid,
    p.uid
  ].sort();

  const chatId = participants.join("_");

  if(window.rabtaChatUnsubscribe){
    window.rabtaChatUnsubscribe();
    window.rabtaChatUnsubscribe = null;
  }

  window.rabtaActiveChatId = chatId;

  const messagesRef =
    window.rabtaFirebaseCollection(
      window.rabtaDB,
      "chats",
      chatId,
      "messages"
    );

  window.rabtaChatUnsubscribe =
    window.rabtaFirebaseOnSnapshot(
      messagesRef,

      function(snapshot){

        let firebaseMessages = [];

        snapshot.forEach(function(messageDoc){

          const data = messageDoc.data();

        // ❤️ Rabta Firebase Seen Status
if(
  data.receiverUid === currentUser.uid &&
  data.senderUid !== currentUser.uid &&
  data.seen !== true
){

  window.rabtaFirebaseUpdateDoc(
    window.rabtaFirebaseDoc(
      window.rabtaDB,
      "chats",
      chatId,
      "messages",
      messageDoc.id
    ),
    {
      seen: true,
      seenAt: Date.now()
    }
  ).catch(function(error){
    console.error("Rabta Seen Error:", error);
  });

  }
          
          firebaseMessages.push({

  type: data.type || "",
text: data.text || "",

// ❤️ Voice + Other Media URLs
mediaUrl: data.mediaUrl || "",
media: data.mediaUrl || "",
audio: data.audio || data.mediaUrl || "",

// ❤️ Voice Duration
durationSeconds: Number(data.durationSeconds || 0),

mediaType: data.mediaType || "",
            // ❤️ Rabta Shared Post / Reel Details
contentId: data.contentId || "",

contentItem: data.contentItem || null,

ownerName: data.ownerName || "Rabta User",

caption: data.caption || "",
  fileName: data.fileName || "",

  publicId: data.publicId || "",
  resourceType: data.resourceType || "",

  time: data.time || "",
createdAt: data.createdAt || 0,

 // ❤️ Rabta Shared Story Details
storyId: data.storyId || "",
ownerUid: data.ownerUid || "",
storyUnavailable: data.storyUnavailable === true,
expiresAt: Number(data.expiresAt || 0),

sender:
    data.senderUid === currentUser.uid
      ? "me"
      : "them",

  senderUid: data.senderUid || "",
  receiverUid: data.receiverUid || "",
replyTo: data.replyTo || null,
  firebaseId: messageDoc.id

});

        });

        // ❤️ Rabta Delete for Me - Hidden Messages Filter

let hiddenMessageIds = [];

try{

  hiddenMessageIds = JSON.parse(
    localStorage.getItem(
      "rabtaHiddenChatMessages_" + chatId
    ) || "[]"
  );

  if(!Array.isArray(hiddenMessageIds)){
    hiddenMessageIds = [];
  }

}catch(error){

  hiddenMessageIds = [];

}

// ❤️ Hidden messages ko Firebase list se hatao
firebaseMessages = firebaseMessages.filter(function(message){

  return !hiddenMessageIds.includes(message.firebaseId);

});

        firebaseMessages.sort(function(a,b){
          return Number(a.createdAt || 0) -
                 Number(b.createdAt || 0);
        });

        let oldMessages = [];

        try{

          oldMessages = JSON.parse(
            localStorage.getItem("chat_" + name) || "[]"
          );

          if(!Array.isArray(oldMessages)){
            oldMessages = [];
          }

        }catch(error){

          oldMessages = [];

        }

        // ❤️ Rabta: Do Not Restore Old Local Media Messages
let mediaMessages = [];

        let combinedMessages = [
          ...mediaMessages,
          ...firebaseMessages
        ];

        combinedMessages.sort(function(a,b){
          return Number(a.createdAt || 0) -
                 Number(b.createdAt || 0);
        });

        localStorage.setItem(
          "chat_" + name,
          JSON.stringify(combinedMessages)
        );

        // ❤️ Sirf naye Firebase data par chat refresh
        const signature = JSON.stringify(firebaseMessages);

        if(window.rabtaLastChatSignature !== signature){

          window.rabtaLastChatSignature = signature;

          if(window.rabtaActiveChatId === chatId){
            openMatchChat(name);
          }

        }

      },

      function(error){

        console.error(
          "Rabta Live Chat Error:",
          error
        );

        alert(
          "Firebase Live Chat Error ❤️\n\n" +
          error.message
        );

      }

    );

}

  const progress = document.getElementById("rabtaVoiceProgress_" + id);

  const timer = document.getElementById("rabtaVoiceTimer_" + id);

  if(!audio || !button || !progress || !timer) return;

  const current = audio.currentTime || 0;

  const duration = audio.duration || 0;

  const percent = duration > 0
    ? (current / duration) * 100
    : 0;

  progress.style.width = percent + "%";

  const formatTime = function(seconds){

    seconds = Math.floor(seconds || 0);

    return String(Math.floor(seconds / 60)).padStart(2,"0")
      + ":" +
      String(seconds % 60).padStart(2,"0");

  };

  timer.innerHTML =
    formatTime(current) + " / " + formatTime(duration);

  button.innerHTML = audio.paused ? "▶" : "Ⅱ";

};

  async function startVoiceRecording(name, action){


if(action === "stop"){

window.rabtaVoiceHoldActive = false;
window.rabtaVoicePendingStop = true;

if(
window.rabtaVoiceRecorder &&
window.rabtaVoiceRecorder.state === "recording"
){

window.rabtaVoiceRecorder = null;

}

return;

if(window.rabtaVoiceHoldActive){
return;
}

window.rabtaVoiceHoldActive = true;
    
if(!navigator.mediaDevices ||
!navigator.mediaDevices.getUserMedia){

alert("Bhai, voice recording ke liye browser permission/support chahiye.");
return;

}

if(!window.MediaRecorder){

alert("Bhai, is browser mein voice recording support nahi hai.");
return;

}

try{

let stream =
await navigator.mediaDevices.getUserMedia({
audio:true
});

  if(!window.rabtaVoiceHoldActive){

stream.getTracks().forEach(function(track){
track.stop();
});

return;

  }
  
let recorder =
new MediaRecorder(stream);

let audioChunks = [];

  let recordingStartedAt = 0;

  if(window.rabtaVoiceTimer){
clearInterval(window.rabtaVoiceTimer);
window.rabtaVoiceTimer = null;
}

let voiceStatus =
document.getElementById("voiceRecordingStatus");

let voiceTimer =
document.getElementById("voiceRecordingTimer");

if(voiceStatus){
voiceStatus.style.display = "block";
}

if(voiceTimer){
voiceTimer.textContent = "00:00";
}
  
recorder.ondataavailable = function(event){

if(event.data && event.data.size > 0){

audioChunks.push(event.data);

}

};

// ❤️ Rabta Firebase + Cloudinary Voice Message
recorder.onstop = async function(){

  if(window.rabtaVoiceTimer){
    clearInterval(window.rabtaVoiceTimer);
    window.rabtaVoiceTimer = null;
  }

  let voiceStatus =
    document.getElementById("voiceRecordingStatus");

  if(voiceStatus){
    voiceStatus.style.display = "none";
  }

  let audioBlob = new Blob(audioChunks,{
    type: recorder.mimeType || "audio/webm"
  });

  stream.getTracks().forEach(function(track){
    track.stop();
  });

  if(audioBlob.size === 0){
    alert("Voice record nahi hui. Dobara try karo.");
    return;
  }

  try{

    // ❤️ Firebase Login Check
    const currentUser =
      window.rabtaAuth.currentUser;

    if(!currentUser){
      throw new Error("Pehle Rabta mein login karo.");
    }

    // ❤️ Receiver Profile
    const profiles =
      window.rabtaCloudProfiles || [];

    const receiver =
      profiles.find(function(p){
        return p.name === name;
      });

    if(!receiver || !receiver.uid){
      throw new Error("Receiver ki Firebase ID nahi mili.");
    }

    // ❤️ Voice Duration
    const durationSeconds = Math.max(
      1,
      Math.round((Date.now() - recordingStartedAt) / 1000)
    );

    const messageTime =
      new Date().toLocaleTimeString([],{
        hour:"2-digit",
        minute:"2-digit"
      });

    const createdAt = Date.now();

    // ❤️ Cloudinary Audio Upload
    const voiceUpload =
      await window.rabtaUploadMediaToCloudinary(
        audioBlob,
        "audio"
      );

    if(
      !voiceUpload ||
      !voiceUpload.mediaUrl
    ){
      throw new Error("Cloudinary par voice upload nahi hui.");
    }

    // ❤️ Same Chat ID for Both Users
const participants = [
  currentUser.uid,
  receiver.uid
].sort();

const chatId = participants.join("_");

// ❤️ Firebase Chat Document
const chatRef = window.rabtaFirebaseDoc(
  window.rabtaDB,
  "chats",
  chatId
);

// ❤️ Create or Update Chat Document
await window.rabtaFirebaseSetDoc(
  chatRef,
  {
    participants: participants,
    createdAt: 0,
    updatedAt: Date.now()
  }
);

    // ❤️ Firebase Voice Message Data
    const voiceMessageData = {

      senderUid: currentUser.uid,

      receiverUid: receiver.uid,

      type: "voiceMessage",

      mediaUrl: voiceUpload.mediaUrl,

      audio: voiceUpload.mediaUrl,

      publicId: voiceUpload.publicId || "",

      resourceType: voiceUpload.resourceType || "video",

      mediaType: "audio",

      fileName: "voice-message.webm",

      durationSeconds: durationSeconds,

      time: messageTime,

      createdAt: createdAt

    };

    // ❤️ Firestore Message Save
    const messageRef =
      await window.rabtaFirebaseAddDoc(
        window.rabtaFirebaseCollection(
          window.rabtaDB,
          "chats",
          chatId,
          "messages"
        ),
        voiceMessageData
      );

    if(!messageRef || !messageRef.id){
      throw new Error("Firebase message ID nahi mila.");
    }

    // ❤️ Active Chat Update
    window.rabtaActiveChatId = chatId;

    // ❤️ Chat Refresh
    openMatchChat(name);

    console.log(
      "Rabta Voice Message Saved:",
      messageRef.id
    );

  }catch(error){

    console.error(
      "Rabta Voice Upload Error:",
      error
    );

    alert(
      "Voice message send nahi hua: " + error.message
    );

  }

};

async function rabtaTrimStoryMusic(file, startTime, duration){

let audioContext = new (window.AudioContext || window.webkitAudioContext)();

try{

let arrayBuffer = await file.arrayBuffer();

let audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
console.log("❤️ Rabta Audio Decode Success");
console.log("Audio Duration:", audioBuffer.duration);
console.log("Audio Format:", file.type);
let sampleRate = audioBuffer.sampleRate;

let startSample = Math.floor(startTime * sampleRate);

let endSample = Math.min(
audioBuffer.length,
Math.floor((startTime + duration) * sampleRate)
);

let frameCount = endSample - startSample;

if(frameCount <= 0){
throw new Error("Invalid trim duration");
}

let channelCount = audioBuffer.numberOfChannels;

let pcmBuffer = new ArrayBuffer(44 + frameCount * channelCount * 2);

let view = new DataView(pcmBuffer);

function writeText(offset, text){

for(let i = 0; i < text.length; i++){

view.setUint8(offset + i, text.charCodeAt(i));

}

}

writeText(0, "RIFF");
view.setUint32(4, 36 + frameCount * channelCount * 2, true);
writeText(8, "WAVE");
writeText(12, "fmt ");
view.setUint32(16, 16, true);
view.setUint16(20, 1, true);
view.setUint16(22, channelCount, true);
view.setUint32(24, sampleRate, true);
view.setUint32(28, sampleRate * channelCount * 2, true);
view.setUint16(32, channelCount * 2, true);
view.setUint16(34, 16, true);
writeText(36, "data");
view.setUint32(40, frameCount * channelCount * 2, true);

let offset = 44;

for(let i = 0; i < frameCount; i++){

for(let channel = 0; channel < channelCount; channel++){

let sample = audioBuffer.getChannelData(channel)[startSample + i];

sample = Math.max(-1, Math.min(1, sample));

let value = sample < 0
? sample * 32768
: sample * 32767;

view.setInt16(offset, value, true);

offset += 2;

}

}

return new File(
[pcmBuffer],
"rabta_story_trim.wav",
{type: "audio/wav"}
);

}finally{

await audioContext.close();

}

  }
async function migrateRabtaImages(){

try{

let db = await rabtaMediaDB();

let chatKeys = [];

for(let i = 0; i < localStorage.length; i++){

let key = localStorage.key(i);

if(key && key.startsWith("chat_")){
chatKeys.push(key);
}

}

let migrated = 0;

for(let key of chatKeys){

let messages;

try{

messages = JSON.parse(
localStorage.getItem(key) || "[]"
);

}catch(error){

continue;

}

if(!Array.isArray(messages)){
continue;
}

let updatedMessages = [];

for(let m of messages){

if(
m &&
m.type === "sharedImage" &&
m.media &&
!m.mediaId &&
m.media.startsWith("data:")
){

let parts = m.media.split(",");

if(parts.length < 2){
updatedMessages.push(m);
continue;
}

let mimeMatch =
parts[0].match(/:(.*?);/);

let mime =
mimeMatch ? mimeMatch[1] : "image/jpeg";

let binary = atob(parts[1]);

let bytes = new Uint8Array(binary.length);

for(let j = 0; j < binary.length; j++){
bytes[j] = binary.charCodeAt(j);
}

let blob = new Blob(
[bytes],
{type:mime}
);

let imageId =
"image_" + Date.now() + "_" +
Math.random().toString(36).slice(2);

await new Promise(function(resolve, reject){

let transaction =
db.transaction(["media"], "readwrite");

let store =
transaction.objectStore("media");

store.put({
id: imageId,
blob: blob,
fileName: m.fileName || "photo",
createdAt: m.createdAt || Date.now()
});

transaction.oncomplete = function(){
resolve();
};

transaction.onerror = function(){
reject(transaction.error);
};

transaction.onabort = function(){
reject(transaction.error);
};

});

let newMessage = {...m};

newMessage.mediaId = imageId;

delete newMessage.media;

updatedMessages.push(newMessage);

migrated++;

}else{

updatedMessages.push(m);

}

}

if(migrated > 0){

localStorage.setItem(
key,
JSON.stringify(updatedMessages)
);

}

}

alert(
"Rabta photo transfer complete ❤️\n" +
"Photos shifted: " + migrated
);

}catch(error){

alert(
"Photo transfer ruk gaya bhai ❤️\n" +
"Purana data delete nahi kiya gaya.\n" +
"Error: " + error.message
);

}

}

  }

  const maxSize = 20 * 1024 * 1024;

  if(file.size > maxSize){
    alert("Media file 20 MB se chhoti honi chahiye.");
    input.value = "";
    return;
  }

  try {

    const currentUser = window.rabtaAuth.currentUser;

    if(!currentUser){
      throw new Error("Pehle Rabta mein login karo.");
    }

    // ❤️ Receiver Firebase Profile
    const profiles = window.rabtaCloudProfiles || [];

    const receiver = profiles.find(function(p){
      return p.name === name;
    });

    if(!receiver || !receiver.uid){
      throw new Error("Receiver Firebase UID nahi mili.");
    }

    // ❤️ Cloudinary Upload
    const mediaType = isVideo ? "video" : "image";

    alert("Media upload ho rahi hai. Please wait ❤️");

    const uploadResult =
      await window.rabtaUploadMediaToCloudinary(
        file,
        mediaType
      );

    if(!uploadResult || !uploadResult.mediaUrl){
      throw new Error("Cloudinary media URL nahi mili.");
    }

    // ❤️ Common Chat ID
    const participants = [
      currentUser.uid,
      receiver.uid
    ].sort();

    const chatId = participants.join("_");

    // ❤️ Chat Document
    await window.rabtaFirebaseSetDoc(
      window.rabtaFirebaseDoc(
        window.rabtaDB,
        "chats",
        chatId
      ),
      {
        participants: participants,
        updatedAt: Date.now()
      },
      { merge: true }
    );

    const createdAt = Date.now();

    const time = new Date().toLocaleTimeString([],{
      hour:"2-digit",
      minute:"2-digit"
    });

    // ❤️ Firebase Message Save
    const messageRef =
      await window.rabtaFirebaseAddDoc(
        window.rabtaFirebaseCollection(
          window.rabtaDB,
          "chats",
          chatId,
          "messages"
        ),
        {
          senderUid: currentUser.uid,
          receiverUid: receiver.uid,

          type: isVideo ? "sharedVideo" : "sharedImage",

          mediaUrl: uploadResult.mediaUrl,
          publicId: uploadResult.publicId,
          resourceType: uploadResult.resourceType,

          mediaType: mediaType,
          fileName: file.name,

          text: "",
          time: time,
          createdAt: createdAt
        }
      );

    // ❤️ Firebase Message ID Save
window.rabtaActiveChatId = chatId;

input.value = "";

openMatchChat(name);

    window.rabtaActiveChatId = chatId;

    input.value = "";

    openMatchChat(name);

  }catch(error){

    console.error("Rabta Chat Media Error:", error);

    alert(
      "Photo/Video Firebase mein send nahi hui ❤️\n\n" +
      error.message
    );

    input.value = "";

  }

}

  // ❤️ Rabta Firebase Chat Message Delete
async function deleteChatMessage(name, index){

  let messages = [];

  try {
    messages = JSON.parse(
      localStorage.getItem("chat_" + name) || "[]"
    );

    if(!Array.isArray(messages)){
      messages = [];
    }

  }catch(error){
    alert("Chat messages load nahi hue.");
    return;
  }

  if(index < 0 || index >= messages.length){
    return;
  }

  let message = messages[index];

  // Call history ko abhi delete nahi karna
  if(
    message.type === "audioCall" ||
    message.type === "videoCall"
  ){
    return;
  }

  let preview = message.text || message.type || "Message";

  if(preview.length > 50){
    preview = preview.substring(0,50) + "...";
  }

  if(!confirm(
    "🗑️ Message Delete\n\n" +
    "\"" + preview + "\"\n\n" +
    "Ye message permanently delete karna hai?"
  )){
    return;
  }

  try {

    const currentUser = window.rabtaAuth.currentUser;

    if(!currentUser){
      alert("Pehle Rabta mein login karo ❤️");
      return;
    }

    // ❤️ Firebase message delete
    if(message.firebaseId){

      const chatId = window.rabtaActiveChatId;

      if(!chatId){
        throw new Error("Firebase Chat ID nahi mili.");
      }

      await window.rabtaFirebaseDeleteDoc(
        window.rabtaFirebaseDoc(
          window.rabtaDB,
          "chats",
          chatId,
          "messages",
          message.firebaseId
        )
      );

    }else if(
      message.sender === "them" ||
      (
        message.senderUid &&
        message.senderUid !== currentUser.uid
      )
    ){

      alert("Aap doosre user ka message delete nahi kar sakte.");
      return;

    }

    // ❤️ Local chat se bhi remove
    messages.splice(index, 1);

    localStorage.setItem(
      "chat_" + name,
      JSON.stringify(messages)
    );

    openMatchChat(name);

  }catch(error){

    console.error("Rabta Message Delete Error:", error);

    alert(
      "Message delete nahi hua ❤️\n\n" +
      error.message
    );

  }

}

  // ❤️ Rabta Universal Original Reply Opener
window.rabtaOpenRepliedMessage = function(name, replyIndex, firebaseId){

  try{

    let messages = JSON.parse(
      localStorage.getItem("chat_" + name) || "[]"
    );

    if(!Array.isArray(messages)) return;

    // ❤️ Firebase ID se original message find karo
    let originalIndex = messages.findIndex(function(m){
      return firebaseId && m.firebaseId === firebaseId;
    });

    // Firebase ID na mile to index use karo
    if(originalIndex < 0){
      originalIndex = Number(replyIndex);
    }

    const original = messages[originalIndex];

    if(!original){
      alert("Original message nahi mila.");
      return;
    }

    // ❤️ Original message screen par lao
    const target = document.getElementById(
      "chatMessage_" + originalIndex
    );

    if(target){
      target.scrollIntoView({
        behavior:"smooth",
        block:"center"
      });

      target.style.outline = "3px solid #ff9800";

      setTimeout(function(){
        target.style.outline = "";
      },1800);
    }

    // ❤️ Photo open
    if(original.type === "sharedImage"){

      let photo = document.getElementById(
        "chatImage_" + (original.mediaId || original.firebaseId)
      );

      let photoUrl = photo
        ? photo.src
        : (original.mediaUrl || original.media || "");

      if(photoUrl && typeof viewChatImage === "function"){
        viewChatImage(photoUrl);
      }

      return;
    }

    // ❤️ Video open
    if(original.type === "sharedVideo"){

      let video = document.getElementById(
        "chatVideo_" + (original.mediaId || original.firebaseId)
      );

      if(video && window.rabtaOpenChatVideo){
        window.rabtaOpenChatVideo(video);
      }

      return;
    }

    // ❤️ Voice Message play
    if(original.type === "voiceMessage"){

      let audio = document.getElementById(
        "rabtaVoiceAudio_" + originalIndex
      );

      if(audio){
        audio.play().catch(function(error){
          console.log("Voice play:",error);
        });
      }

      return;
    }

    // ❤️ Shared Reel / Post open
    if(
      original.type === "sharedReel" ||
      original.type === "sharedPost"
    ){

      let contentKey =
        "rabta_" + name + "_" + originalIndex;

      let contentItem =
        window.rabtaChatSharedContent &&
        window.rabtaChatSharedContent[contentKey];

      if(contentItem){

        if(original.type === "sharedReel" &&
           window.rabtaOpenReelViewer){

          window.rabtaOpenReelViewer(contentItem);

        }else if(
          original.type === "sharedPost" &&
          window.rabtaOpenPostViewer
        ){

          window.rabtaOpenPostViewer(contentItem);
        }

      }

      return;
    }

    // ❤️ Shared Story open
    if(original.type === "sharedStory"){

      if(
        original.storyId &&
        window.rabtaOpenFirebaseStoryFromChat
      ){

        window.rabtaOpenFirebaseStoryFromChat(
          encodeURIComponent(original.storyId)
        );

      }

      return;
    }

  }catch(error){

    console.error(
      "Rabta Reply Open Error:",
      error
    );

  }

// ❤️ Rabta Universal Message Reply

function setReplyMessage(name, index){

  let messages = [];

  try{

    messages = JSON.parse(
      localStorage.getItem("chat_" + name) || "[]"
    );

    if(!Array.isArray(messages)){
      messages = [];
    }

  }catch(error){
    return;
  }

  const message = messages[index];

  if(!message) return;

  let replyText = message.text || "";

  if(!replyText){

    switch(message.type){

      case "sharedImage":
        replyText = "📷 Photo";
        break;

      case "sharedVideo":
        replyText = "🎥 Video";
        break;

      case "voiceMessage":
        replyText = "🎤 Voice message";
        break;

      case "sharedPost":
        replyText = "📷 Shared Post";
        break;

      case "sharedReel":
        replyText = "🎬 Shared Reel";
        break;

      case "sharedStory":
        replyText = "❤️ Shared Story";
        break;

      case "audioCall":
        replyText = "📞 Audio Call";
        break;

      case "videoCall":
        replyText = "📹 Video Call";
        break;

      default:
        replyText = "Message";
    }

  }

  window.rabtaReplyTo = {
  name: name,
  index: index,
  text: replyText,

  // ❤️ Original message ki details
  firebaseId: message.firebaseId || "",
  type: message.type || "",
  mediaUrl: message.mediaUrl || message.media || "",
  mediaId: message.mediaId || "",
  storyId: message.storyId || ""
};

  const preview =
    document.getElementById("replyPreview");

  const previewText =
    document.getElementById("replyPreviewText");

  if(preview && previewText){

    preview.style.display = "block";
    previewText.textContent = replyText;

  }

  const input =
    document.getElementById("chatMessage");

  if(input){
    input.focus();
  }

}

async function sendChatMessage(name){

  const input = document.getElementById("chatMessage");

  if(!input) return;

  const message = input.value.trim();

  if(!message) return;

  const currentUser = window.rabtaAuth.currentUser;

  if(!currentUser){
    alert("Pehle Rabta mein login karo.");
    return;
  }

  const cloudProfiles = window.rabtaCloudProfiles || [];

  const receiver = cloudProfiles.find(function(p){
    return p.name === name;
  });

  if(!receiver || !receiver.uid){
    alert("Doosre user ki Firebase UID nahi mili.");
    return;
  }

  if(receiver.uid === currentUser.uid){
    alert("Apne aap ko message nahi bhej sakte.");
    return;
  }

  // ❤️ Chat ID
  const participants = [
    currentUser.uid,
    receiver.uid
  ].sort();

  const chatId = participants.join("_");

  // ❤️ Rabta Chat Document Cache
if(!window.rabtaChatDocumentReady){
  window.rabtaChatDocumentReady = new Set();
}
  
  // ❤️ Reply Data
  let replyData = null;

  if(
    window.rabtaReplyTo &&
    window.rabtaReplyTo.name === name
  ){

    replyData = {
      text: window.rabtaReplyTo.text || "",
      index: Number(window.rabtaReplyTo.index || 0),
      firebaseId: window.rabtaReplyTo.firebaseId || "",
      type: window.rabtaReplyTo.type || "",
      mediaUrl: window.rabtaReplyTo.mediaUrl || "",
      mediaId: window.rabtaReplyTo.mediaId || "",
      storyId: window.rabtaReplyTo.storyId || ""
    };

  }

  // ❤️ Unique Temporary Message ID
  const tempId =
    "rabta_temp_" + Date.now() + "_" +
    Math.random().toString(36).slice(2,8);

  const messageTime = new Date().toLocaleTimeString(
    [],
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );

  const createdAt = Date.now();

  // ❤️ Instant Message Display
  const chatArea = document.getElementById(
    "rabtaChatMessagesArea"
  );

  if(chatArea){

    const bubble = document.createElement("div");

    bubble.id = tempId;

    bubble.style.cssText = `
      background:#ff1744;
      color:white;
      padding:10px 14px;
      border-radius:18px;
      margin:8px 0 8px auto;
      max-width:80%;
      width:fit-content;
      text-align:left;
      box-sizing:border-box;
    `;

    // ❤️ Reply Preview
    if(replyData){

      const replyBox = document.createElement("div");

      replyBox.style.cssText = `
        background:rgba(128,128,128,0.2);
        border-left:3px solid white;
        border-radius:8px;
        padding:7px 9px;
        margin-bottom:7px;
        font-size:12px;
        cursor:pointer;
      `;

      const replyTitle = document.createElement("div");

      replyTitle.textContent = "↩️ Reply to message";

      replyTitle.style.fontWeight = "bold";

      const replyText = document.createElement("div");

      replyText.textContent = replyData.text;

      replyText.style.cssText = `
        margin-top:4px;
        overflow-wrap:anywhere;
      `;

      replyBox.appendChild(replyTitle);
      replyBox.appendChild(replyText);

      replyBox.onclick = function(){

        if(window.rabtaOpenRepliedMessage){

          window.rabtaOpenRepliedMessage(
            name,
            replyData.index,
            replyData.firebaseId
          );

        }

      };

      bubble.appendChild(replyBox);

    }

    // ❤️ Message Text
    const messageText = document.createElement("div");

    messageText.textContent = message;

    messageText.style.cssText = `
      overflow-wrap:anywhere;
      white-space:pre-wrap;
    `;

    bubble.appendChild(messageText);

    // ❤️ Time
    const timeBox = document.createElement("div");

    timeBox.textContent = messageTime + " · Sending...";

    timeBox.style.cssText = `
      font-size:10px;
      opacity:.8;
      text-align:right;
      margin-top:5px;
    `;

    bubble.appendChild(timeBox);

    // ❤️ Screen par turant add
    chatArea.appendChild(bubble);

    chatArea.scrollTop = chatArea.scrollHeight;

  }

  // ❤️ Input Turant Clear
  input.value = "";

  window.rabtaReplyTo = null;

  const replyPreview = document.getElementById("replyPreview");

  if(replyPreview){
    replyPreview.style.display = "none";
  }

  // ❤️ Typing Status Clear
  if(window.rabtaTypingTimers){
    clearTimeout(window.rabtaTypingTimers[name]);
  }

  if(window.rabtaSetLiveTyping){
    window.rabtaSetLiveTyping(name,false).catch(function(){});
  }

  localStorage.removeItem("typing_" + name);

  // ❤️ Camera / Voice Buttons Restore
  const cameraButton = document.getElementById("chatCameraButton");
  const voiceButton = document.getElementById("chatVoiceButton");

  if(cameraButton) cameraButton.style.display = "flex";
  if(voiceButton) voiceButton.style.display = "flex";

  // ❤️ Firebase Background Save
try{

  const chatRef = window.rabtaFirebaseDoc(
    window.rabtaDB,
    "chats",
    chatId
  );

  // ❤️ Rabta Save Timing Initialize
window.rabtaSaveTiming = {
  startedAt: performance.now(),
  chatDocument: "Saving...",
  messageSave: "Waiting..."
};
  
  // ❤️ Save Chat Document Only Once

if(!window.rabtaChatDocumentReady.has(chatId)){

  console.time("RABTA_CHAT_DOCUMENT");

  await window.rabtaFirebaseSetDoc(
    chatRef,
    {
      participants: participants,
      createdAt: 0,
      updatedAt: createdAt
    }
  );

  console.timeEnd("RABTA_CHAT_DOCUMENT");

  window.rabtaSaveTiming.chatDocument =
    ((performance.now() - window.rabtaSaveTiming.startedAt) / 1000).toFixed(2) + " seconds";

  // Save successful hone ke baad hi cache mein add karo
  window.rabtaChatDocumentReady.add(chatId);

}else{

  window.rabtaSaveTiming.chatDocument = "Already ready";

}
  
  console.time("RABTA_MESSAGE_SAVE");

  const messageRef = await window.rabtaFirebaseAddDoc(
    window.rabtaFirebaseCollection(
      window.rabtaDB,
      "chats",
      chatId,
      "messages"
    ),
    {
      senderUid: currentUser.uid,
      receiverUid: receiver.uid,
      seen: false,
      seenAt: 0,
      text: message,

      replyTo: replyData ? {
        text: replyData.text,
        index: replyData.index,
        firebaseId: replyData.firebaseId,
        type: replyData.type,
        mediaUrl: replyData.mediaUrl,
        mediaId: replyData.mediaId,
        storyId: replyData.storyId
      } : null,

      createdAt: createdAt,
      time: messageTime
    }
  );

  console.timeEnd("RABTA_MESSAGE_SAVE");
window.rabtaSaveTiming.messageSave =
  ((performance.now() - window.rabtaSaveTiming.startedAt) / 1000).toFixed(2) + " seconds";

alert(
  "❤️ Rabta Firebase Save Time\n\n" +
  "Chat Document: " + window.rabtaSaveTiming.chatDocument + "\n" +
  "Message Save: " + window.rabtaSaveTiming.messageSave
);
  
  const savedBubble = document.getElementById(tempId);

  if(savedBubble){

    savedBubble.dataset.firebaseId = messageRef.id;

    const timeBox = savedBubble.lastElementChild;

    if(timeBox){
      timeBox.textContent = messageTime + " ✓";
    }

  }

  console.log("Rabta Message Saved:", messageRef.id);

}catch(error){

  console.error("Rabta Firebase Chat Error:", error);

  const failedBubble = document.getElementById(tempId);

  if(failedBubble){
    failedBubble.remove();
  }

  const currentInput = document.getElementById("chatMessage");

  if(currentInput && !currentInput.value){
    currentInput.value = message;
  }

    alert(
    "Message Firebase mein save nahi hua.\n\n" +
    error.message
  );

}

}

window.rabtaReactToStory = async function(storyId, emoji){

  try {

    const user =
      window.rabtaAuth &&
      window.rabtaAuth.currentUser;

    if(!user){
      throw new Error("Pehle login karo.");
    }

    if(!storyId || !emoji){
      throw new Error("Story ID ya reaction nahi mili.");
    }

    const storyRef = window.rabtaFirebaseDoc(
      window.rabtaDB,
      "stories",
      storyId
    );

    const storySnapshot =
      await window.rabtaFirebaseGetDoc(storyRef);

    if(!storySnapshot.exists()){
      throw new Error("Story nahi mili.");
    }

    const storyData = storySnapshot.data();

    if(storyData.ownerUid === user.uid){
      throw new Error("Apni Story par reaction nahi bhej sakte.");
    }

    const userInfo =
      await window.rabtaGetSocialUserInfo(user.uid);

    const reactionRef = window.rabtaFirebaseDoc(
      window.rabtaDB,
      "stories",
      storyId,
      "reactions",
      user.uid
    );

    await window.rabtaFirebaseSetDoc(reactionRef, {

  // ❤️ Rabta Instagram Style — Swipe Filters on Story Photo
(function(){

  let media = app.querySelector("#rabtaStoryPreviewMedia");

  if(!media || !Array.isArray(rabtaInstagramFilters)){
    console.log("Rabta swipe filters: media ya filters nahi mile");
    return;
  }

  let startX = 0;
  let startY = 0;
  let trackingSwipe = false;

  // ❤️ Current filter ka index
  function getCurrentFilterIndex(){

    let index = rabtaInstagramFilters.findIndex(function(f){
      return f.value === filterValue;
    });

    return index >= 0 ? index : 0;
  }

  // ❤️ Filter apply karo
  function applySwipeFilter(index){

    index = Math.max(
      0,
      Math.min(index, rabtaInstagramFilters.length - 1)
    );

    let selectedFilter = rabtaInstagramFilters[index];

    filterValue = selectedFilter.value;
    media.style.filter = selectedFilter.value;

    // ❤️ 20 filter covers ka selection update karo
    let filtersRow = app.querySelector("#rabtaStoryFiltersRow");

    if(filtersRow){

      filtersRow.querySelectorAll("[data-filter-index]").forEach(function(btn){

        let selected =
          Number(btn.dataset.filterIndex) === index;

        btn.style.border =
          selected ? "2px solid #ff4081" : "2px solid transparent";

        btn.style.background =
          selected ? "#ff1744" : "transparent";

        let cover = btn.querySelector("div");

        if(cover){
          cover.style.border =
            selected
              ? "2px solid #ff4081"
              : "2px solid rgba(255,255,255,.35)";
        }

      });

    }

    console.log("❤️ Swipe filter:", selectedFilter.name);
  }

  // ❤️ Finger touch start
  media.addEventListener("pointerdown", function(event){

    if(event.isPrimary === false) return;

    startX = event.clientX;
    startY = event.clientY;
    trackingSwipe = true;

  });

  // ❤️ Finger touch end
  media.addEventListener("pointerup", function(event){

    if(!trackingSwipe) return;

    trackingSwipe = false;

    let diffX = event.clientX - startX;
    let diffY = event.clientY - startY;

    // Chhote ya vertical swipe ignore karo
    if(Math.abs(diffX) < 45) return;
    if(Math.abs(diffX) < Math.abs(diffY)) return;

    let currentIndex = getCurrentFilterIndex();

    // Right se left = next filter
    if(diffX < 0){

      applySwipeFilter(
        (currentIndex + 1) % rabtaInstagramFilters.length
      );

    }

    // Left se right = previous filter
    else {

      applySwipeFilter(
        (currentIndex - 1 + rabtaInstagramFilters.length) %
        rabtaInstagramFilters.length
      );

    }

  });

  media.addEventListener("pointercancel", function(){
    trackingSwipe = false;
  });

  media.style.touchAction = "pan-y";

})();
  
  // ❤️ Rabta: Story ke GIF Stickers ki position aur size save karo

function rabtaCaptureStoryGifStickers() {

  let stage = app.querySelector("#rabtaStoryStickerStage");
  let layer = app.querySelector("#rabtaStoryGifLayer");

  if (!stage || !layer) {
    return [];
  }

  let stageRect = stage.getBoundingClientRect();
  let stickers = layer.querySelectorAll("img");
  let savedStickers = [];

  stickers.forEach(function(sticker) {

    let rect = sticker.getBoundingClientRect();

    if (!sticker.src || stageRect.width <= 0 || stageRect.height <= 0) {
      return;
    }

    savedStickers.push({

      url: sticker.src,

      // ❤️ Sticker ki position percentage mein
      x: (
        (rect.left + rect.width / 2 - stageRect.left) /
        stageRect.width
      ) * 100,

      y: (
        (rect.top + rect.height / 2 - stageRect.top) /
        stageRect.height
      ) * 100,

      // ❤️ Sticker ka dikhne wala size save karo
      width: (rect.width / stageRect.width) * 100

    });

  });

  return savedStickers;
}

  // ❤️ Rabta: Story ke Text Stickers save karo
function rabtaCaptureStoryTextStickers() {

  let stage = app.querySelector("#rabtaStoryStickerStage");

  if (!stage) {
    return [];
  }

  let stickers = stage.querySelectorAll(
    ".rabtaStoryTextSticker"
  );

  let savedTexts = [];

  let stageRect = stage.getBoundingClientRect();

  if (stageRect.width <= 0 || stageRect.height <= 0) {
    return [];
  }

  stickers.forEach(function(sticker) {

    let rect = sticker.getBoundingClientRect();

    savedTexts.push({

      text:
        sticker.getAttribute("data-rabta-text") ||
        sticker.textContent,

      style:
        sticker.getAttribute("data-rabta-text-style") ||
        "normal",

      color:
        sticker.getAttribute("data-rabta-text-color") ||
        "#ffffff",

      background:
        sticker.getAttribute("data-rabta-text-bg") ||
        "transparent",

      x: (
        (rect.left + rect.width / 2 - stageRect.left) /
        stageRect.width
      ) * 100,

      y: (
        (rect.top + rect.height / 2 - stageRect.top) /
        stageRect.height
      ) * 100,

      fontSize:
        parseFloat(getComputedStyle(sticker).fontSize) || 30

    });

  });

  return savedTexts;
}

        data.expiresAt ||

          createdAt: createdAt,

        });

    // ❤️ Left-right swipe
    if (
      Math.abs(differenceX) > 60 &&
      Math.abs(differenceX) > Math.abs(differenceY)
    ) {

      if (window.rabtaStoryTimer) {
        clearTimeout(window.rabtaStoryTimer);
        window.rabtaStoryTimer = null;
      }

      if (differenceX < 0) {
        window.rabtaNextMyStory();
      } else {
        window.rabtaPreviousMyStory();
      }

      return;
    }

    // ❤️ Chhota tap
    if (
      Math.abs(differenceX) < 15 &&
      Math.abs(differenceY) < 15 &&
      touchDuration < 500
    ) {

      const screenWidth = window.innerWidth;

      if (touch.clientX > screenWidth / 2) {

        window.rabtaNextMyStory();

      } else {

        window.rabtaPreviousMyStory();

      }

    }

  }, { passive: true });

}
  
}

window.rabtaPreviousMyStory = function(){

if(currentIndex > 0){
currentIndex--;
renderStory();
}

};

  // ❤️ Rabta My Story — Next Story Navigation
window.rabtaNextMyStory = async function(){

  // ❤️ Duplicate navigation rokna
  if(window.rabtaMyStoryNextActive){
    return;
  }

  // ❤️ Apni agli Story
  if(currentIndex < stories.length - 1){

    window.rabtaMyStoryNextActive = true;

    currentIndex++;

    renderStory();

    window.rabtaMyStoryNextActive = false;

    return;
  }

  // ❤️ Aakhri Story — ab My Story dobara render nahi hogi
  window.rabtaMyStoryNextActive = true;
  window.rabtaMyStoryExitActive = true;

  // ❤️ Purana timer band karo
  if(window.rabtaStoryTimer){
    clearTimeout(window.rabtaStoryTimer);
    window.rabtaStoryTimer = null;
  }

  // ❤️ Progress animation band karo
  if(window.rabtaStoryProgressFrame){
    cancelAnimationFrame(
      window.rabtaStoryProgressFrame
    );

    window.rabtaStoryProgressFrame = null;
  }

  try {

    if(typeof window.rabtaLoadPublicStoriesFromFirebase !== "function"){
      throw new Error("Public Stories loader nahi mila.");
    }

    const user =
      window.rabtaAuth &&
      window.rabtaAuth.currentUser;

    if(!user){
      throw new Error("Login session nahi mili.");
    }

    const cloudStories =
      await window.rabtaLoadPublicStoriesFromFirebase();

    const otherStories = (
      Array.isArray(cloudStories) ? cloudStories : []
    ).filter(function(story){

      return (
        story.ownerUid !== user.uid &&
        story.audience === "public" &&
        story.storyId &&
        story.mediaUrl
      );

    });

    otherStories.sort(function(a,b){

      return Number(b.createdAt || 0) -
             Number(a.createdAt || 0);

    });

    const otherStoryIds = otherStories.map(function(story){

      return story.storyId;

    });

    if(otherStoryIds.length > 0){

      if(typeof window.rabtaStopStoryProgress === "function"){
        window.rabtaStopStoryProgress();
      }

      window.rabtaShowStoryLoading = true;

      await window.rabtaOpenFirebaseStoryGroup(
        encodeURIComponent(JSON.stringify(otherStoryIds))
      );

      return;
    }

    // ❤️ Doosri Story nahi mili
    window.rabtaMyStoryExitActive = false;
    window.rabtaMyStoryNextActive = false;

    if(typeof discover === "function"){
      discover();
    }

  } catch(error){

    window.rabtaMyStoryExitActive = false;
    window.rabtaMyStoryNextActive = false;

    console.error("Rabta Next Story Error:", error);

    alert(
      "Doosri Stories load nahi hui ❤️\n" +
      (error.message || String(error))
    );

  }

};

renderStory();

window.rabtaAddStoryComment = async function(
  storyId,
  commentText
){

  try {

    const user =
      window.rabtaAuth &&
      window.rabtaAuth.currentUser;

    if(!user){
      throw new Error("Pehle login karo.");
    }

    const text = String(commentText || "").trim();

    if(!text){
      throw new Error("Reply khaali nahi ho sakta.");
    }

    if(text.length > 500){
      throw new Error("Reply 500 characters se chhota rakho.");
    }

    const storyRef = window.rabtaFirebaseDoc(
      window.rabtaDB,
      "stories",
      storyId
    );

    const storySnapshot =
      await window.rabtaFirebaseGetDoc(storyRef);

    if(!storySnapshot.exists()){
      throw new Error("Story nahi mili.");
    }

    const storyData = storySnapshot.data();

    if(storyData.ownerUid === user.uid){
      throw new Error("Apni Story par reply nahi kar sakte.");
    }

    const userInfo =
      await window.rabtaGetSocialUserInfo(user.uid);

    const commentsRef =
      window.rabtaFirebaseCollection(
        window.rabtaDB,
        "stories",
        storyId,
        "comments"
      );

    const savedComment =
      await window.rabtaFirebaseAddDoc(commentsRef, {

        senderUid: user.uid,
        senderName: userInfo.name,
        senderPhoto: userInfo.photo,
        ownerUid: storyData.ownerUid,
        storyId: storyId,
        text: text,
        createdAt: Date.now()

      });

    // ❤️ Story owner ko notification
    if(
      typeof window.rabtaSaveSocialNotification === "function"
    ){

      await window.rabtaSaveSocialNotification(
        "story",
        storyId,
        "comment",
        savedComment.id
      );

    }

    return {
      success:true,
      id:savedComment.id
    };

  } catch(error) {

    console.error("Rabta Story Reply Error:", error);
    throw error;

  }

};

window.rabtaLoadStoryComments = async function(storyId){

  try {

    if(!storyId){
      throw new Error("Story ID nahi mili.");
    }

    const commentsRef =
      window.rabtaFirebaseCollection(
        window.rabtaDB,
        "stories",
        storyId,
        "comments"
      );

    const snapshot =
      await window.rabtaFirebaseGetDocs(commentsRef);

    const comments = snapshot.docs.map(function(doc){

      return {
        id: doc.id,
        ...doc.data()
      };

    });

    // ❤️ Latest reply pehle
    comments.sort(function(a,b){

      return Number(b.createdAt || 0) -
             Number(a.createdAt || 0);

    });

    return comments;

  } catch(error) {

    console.error("Rabta Story Replies Load Error:", error);
    throw error;

  }

};

window.rabtaStoryTimeAgo = function(createdAt){

  const uploadedAt = Number(createdAt || 0);

  if(!uploadedAt || uploadedAt > Date.now()){
    return "Just now";
  }

  const elapsed = Date.now() - uploadedAt;
  const minutes = Math.floor(elapsed / 60000);
  const hours = Math.floor(elapsed / 3600000);

  if(minutes < 1){
    return "Just now";
  }

  if(minutes < 60){
    return minutes + " min ago";
  }

  if(hours < 24){
    return hours + " hr ago";
  }

  return "Expired";
};

// ❤️ Rabta Public Story — Pause Video + Progress
window.rabtaPauseFirebaseStoryProgress = function(){

  const state =
    window.rabtaFirebaseStoryProgressState;


    
  if(!state || state.paused) return;

  // ❤️ Public Story video pause
  const video = document.getElementById(
    "rabtaFirebaseStoryVideo"
  );

  if(video && !video.paused){
    video.pause();
  }

  // ❤️ Progress ka remaining time calculate
  const elapsed = Date.now() - state.startedAt;

  state.remaining = Math.max(
    0,
    state.remaining - elapsed
  );

  state.paused = true;

  // ❤️ Auto next timer stop
  if(window.rabtaFirebaseStoryTimer){

    clearTimeout(window.rabtaFirebaseStoryTimer);

    window.rabtaFirebaseStoryTimer = null;

  }

  // ❤️ Progress line freeze
  if(state.fill && state.fill.isConnected){

    const currentWidth =
      parseFloat(getComputedStyle(state.fill).width);

    const parentWidth =
      state.fill.parentElement
        ? state.fill.parentElement.clientWidth
        : 0;

    const percentage = parentWidth > 0
      ? (currentWidth / parentWidth) * 100
      : 0;

    state.fill.style.transition = "none";

    state.fill.style.width = percentage + "%";

  }

};

// ❤️ Rabta Discover Search: Firebase Only
async function filterDiscoverProfiles(value){

  const search = String(value || "").trim().toLowerCase();

  const box = document.getElementById("discoverSearchResults");

  if(!box) return;

  box.innerHTML = `
    <p style="text-align:center;color:#888;padding:12px;">
      ❤️ Firebase profiles load ho rahi hain...
    </p>
  `;

  try{

    // ❤️ Login check
    const currentUser = window.rabtaAuth?.currentUser;

    if(!currentUser){
      box.innerHTML = `
        <p style="text-align:center;color:#888;padding:12px;">
          Pehle Rabta mein login karo ❤️
        </p>
      `;
      return;
    }

    // ❤️ Firebase se public profiles load
    if(typeof window.rabtaLoadPublicProfiles !== "function"){
      throw new Error("Firebase Public Profile Loader nahi mila.");
    }

    const cloudProfiles =
      await window.rabtaLoadPublicProfiles();

    window.rabtaCloudProfiles = cloudProfiles;

    // ❤️ Firebase se connection statuses load
    if(typeof window.rabtaLoadMyConnectionStatuses === "function"){
      window.rabtaConnectionStatuses =
        await window.rabtaLoadMyConnectionStatuses();
    }else{
      window.rabtaConnectionStatuses = {};
    }

    // ❤️ Firebase se confirmed connections load
    let myConnections = {
      added: [],
      addedYou: []
    };

    if(typeof window.rabtaLoadProfileConnections === "function"){

      myConnections =
        await window.rabtaLoadProfileConnections(currentUser.uid);

    }

    // ❤️ Added connections UID
    const hiddenConnectionUids = new Set([
      ...(myConnections.added || []),
      ...(myConnections.addedYou || [])
    ].map(function(person){
      return String(person.uid);
    }));

    // ❤️ Firebase profiles search
    const cloudResults = cloudProfiles.filter(function(p){

      const uid = String(p.uid || "");

      const matchesSearch =
        String(p.name || "").toLowerCase().includes(search) ||
        String(p.city || "").toLowerCase().includes(search);

      const status =
        window.rabtaConnectionStatuses[uid];

      const isAlreadyAdded =
        status === "confirmed";

      const isHiddenConnection =
        hiddenConnectionUids.has(uid);

      return (
        uid !== currentUser.uid &&
        matchesSearch &&
        !isAlreadyAdded &&
        !isHiddenConnection
      );

    });

    // ❤️ Firebase se apni profile load karo
const myProfileRef = window.rabtaFirebaseDoc(
  window.rabtaDB,
  "publicProfiles",
  currentUser.uid
);

const myProfileSnapshot =
  await window.rabtaFirebaseGetDoc(myProfileRef);

let myProfile = {};

if(myProfileSnapshot.exists()){
  myProfile = myProfileSnapshot.data();
}

const myVibes = Array.isArray(myProfile.vibes)
  ? myProfile.vibes.map(v => String(v).toLowerCase())
  : [];

const myLookingFor = String(myProfile.lookingFor || "").toLowerCase();

const myCity = String(myProfile.city || "").trim().toLowerCase();

// ❤️ Match Score + Nearby Priority
cloudResults.sort(function(a, b){

  function calculateScore(profile){

    const theirVibes = Array.isArray(profile.vibes)
      ? profile.vibes.map(v => String(v).toLowerCase())
      : [];

    const commonVibes = myVibes.filter(function(v){
      return theirVibes.includes(v);
    });

    const vibeScore = myVibes.length
      ? (commonVibes.length / myVibes.length) * 70
      : 0;

    const theirLookingFor =
      String(profile.lookingFor || "").toLowerCase();

    const lookingScore =
      myLookingFor && theirLookingFor &&
      myLookingFor === theirLookingFor
        ? 30
        : 0;

    return vibeScore + lookingScore;
  }

  const scoreA = calculateScore(a);
  const scoreB = calculateScore(b);

  // Pehle highest Vibe Match
  if(scoreA !== scoreB){
    return scoreB - scoreA;
  }

  // Same city ko priority
  const cityA =
    String(a.city || "").trim().toLowerCase() === myCity;

  const cityB =
    String(b.city || "").trim().toLowerCase() === myCity;

  return Number(cityB) - Number(cityA);

});
    
    // ❤️ No profiles found
    if(cloudResults.length === 0){

      box.innerHTML = `
        <p style="text-align:center;color:#888;padding:12px;">
          😔 Koi Firebase profile nahi mili

                 style="background:#ff1744;color:white;border:0;border-radius:20px;padding:8px 14px;font-weight:bold;">
                 ➕ Add Back
               </button>`

            : status === "pending"

                 style="background:#ff1744;color:white;border:0;border-radius:20px;padding:8px 14px;font-weight:bold;">
                 ❤️ Add
               </button>`

        </div>

      `;

    box.innerHTML = `

        ${cloudHTML}

  }catch(error){

        Firebase profiles load nahi hui ❤️
        <br>

  }

}


  // ❤️ Rabta Add Connection — Firebase Only
async function rabtaAddConnection(name){

  const cloudProfiles = Array.isArray(window.rabtaCloudProfiles)
    ? window.rabtaCloudProfiles
    : [];

  const cloudProfile = cloudProfiles.find(function(p){
    return p.name === name;
  });

  if(!cloudProfile || !cloudProfile.uid){
    alert("Firebase profile nahi mili. Dobara Discover refresh karo.");
    return;
  }

  if(typeof window.rabtaSendFirebaseConnectionRequest !== "function"){
    alert("Firebase connection helper nahi mila.");
    return;
  }

  try{

    await window.rabtaSendFirebaseConnectionRequest(
      cloudProfile.uid
    );

    // ❤️ Discover profiles refresh
    const searchBox = document.getElementById("rabtaProfileSearch");

    if(searchBox){
      await filterDiscoverProfiles(searchBox.value);
    }

  }catch(error){

    console.error("Rabta Add Connection Error:", error);

    alert("Connection request nahi bheji ja saki:\n" + error.message);

  }

}

  // ❤️ Rabta: My Connections se connection remove karo
async function rabtaRemoveConnection(name){

  const confirmed = confirm(
    "❤️ Kya tum " + name +
    " ko My Connections se hatana chahte ho?"
  );

  if(!confirmed) return;

  const user = window.rabtaAuth
    ? window.rabtaAuth.currentUser
    : null;

  // ☁️ Firebase request records delete karo
  if(user && window.rabtaDB){

    try{

      const cloudProfiles = Array.isArray(
        window.rabtaCloudProfiles
      ) ? window.rabtaCloudProfiles : [];

      const cloudProfile = cloudProfiles.find(
        p => p.name === name
      );

      if(cloudProfile && cloudProfile.uid){

        const requestIds = [
          user.uid + "_" + cloudProfile.uid,
          cloudProfile.uid + "_" + user.uid
        ];

        for(const requestId of requestIds){

          const requestRef = window.rabtaFirebaseDoc(
  window.rabtaDB,
  "connectionRequests",
  requestId
);

const requestSnapshot = await window.rabtaFirebaseGetDoc(requestRef);

          if(requestSnapshot.exists()){

            const requestData = requestSnapshot.data();

            if(
              requestData.senderUid === user.uid ||
              requestData.receiverUid === user.uid
            ){

              await window.rabtaFirebaseDeleteDoc(requestRef);

            }

          }

        }

      }

    }catch(error){

      console.error("Rabta Remove Error:", error);

      alert(
        "Bhai, Firebase connection remove nahi hua ❤️\n" +
        error.code + "\n" + error.message
      );

      return;

    }

  }

  // ❤️ Local connection list se remove karo
  let connections = JSON.parse(
    localStorage.getItem("rabtaConnections") || "[]"
  );

  connections = connections.filter(
    c => c.name !== name
  );

  localStorage.setItem(
    "rabtaConnections",
    JSON.stringify(connections)
  );

  // ❤️ Local request list se remove karo
  let requests = JSON.parse(
    localStorage.getItem("rabtaConnectionRequests") || "[]"
  );

  requests = requests.filter(
    r => r.name !== name
  );

  localStorage.setItem(
    "rabtaConnectionRequests",
    JSON.stringify(requests)
  );

  alert(
    "❤️ " + name +
    " ko My Connections se hata diya gaya."
  );

  rabtaMyConnections();

}

function rabtaHandleRequest(name, status){

let requests = JSON.parse(
localStorage.getItem("rabtaConnectionRequests") || "[]"
);

requests = requests.map(r => {
if(r.name === name && r.status === "pending"){
r.status = status;
}
return r;
});

localStorage.setItem(
"rabtaConnectionRequests",
JSON.stringify(requests)
);

let connections = JSON.parse(
localStorage.getItem("rabtaConnections") || "[]"
);

if(status === "confirmed"){

let alreadyConnected = connections.some(
c => c.name === name
);

if(!alreadyConnected){

connections.push({
name: name,
createdAt: Date.now()
});

}

}else if(status === "rejected"){

connections = connections.filter(
c => c.name !== name
);

}

localStorage.setItem(
"rabtaConnections",
JSON.stringify(connections)
);

alert(status === "confirmed"
? "❤️ Connection confirmed!"
: "Request rejected."
);

rabtaConnectionRequests();

}

  function toggleVibe(button){

let selected = JSON.parse(localStorage.getItem("tempVibes") || "[]");
let vibe = button.dataset.vibe;

if(selected.includes(vibe)){

selected = selected.filter(v => v !== vibe);

button.style.background = "#fff5f8";
button.style.color = "#ff1744";

}else{

if(selected.length >= 3){
alert("Maximum 3 Vibes select kar sakte ho ❤️");
return;
}

selected.push(vibe);

button.style.background = "#ff1744";
button.style.color = "white";

}

localStorage.setItem("tempVibes", JSON.stringify(selected));

  }
  

async function saveProfile(){

let name = document.getElementById("editName").value;
let age = document.getElementById("editAge").value;
let city = document.getElementById("editCity").value;
let bio = document.getElementById("editBio").value;
let interests = document.getElementById("editInterests").value;
let gender = document.getElementById("editGender").value;
let lookingFor = document.getElementById("editLookingFor").value;

let selectedVibes = JSON.parse(
  localStorage.getItem("tempVibes") || "[]"
);

let photoInput = document.getElementById("profilePhoto");

  // Temporary vibe selection clear karo
localStorage.removeItem("tempVibes");

  let profileData = {
  name: name,
  age: age,
  city: city,
  bio: bio,
  interests: interests,
  gender: gender,
  lookingFor: lookingFor,
  vibes: selectedVibes
};

async function finishProfileSave(){

  if(typeof window.rabtaSaveCloudProfile !== "function"){
    alert("Firebase Cloud Save helper nahi mila ❤️");
    return false;
  }

  try{

    // Purani photo Firebase se preserve karo
    if(!profileData.photo){

      const user = window.rabtaAuth.currentUser;

      if(user){

        const publicDoc = await getDoc(
          doc(window.rabtaDB, "publicProfiles", user.uid)
        );

        if(publicDoc.exists()){

          const oldData = publicDoc.data();

          profileData.photo =
            oldData.photo ||
            oldData.profilePhoto ||
            "";

          profileData.profilePhoto = profileData.photo;

        }

      }

    }

    const saved = await window.rabtaSaveCloudProfile(profileData);

    if(!saved){
      return false;
    }

    await profile();

    return true;

  }catch(error){

    console.error("Rabta Profile Save Error:", error);

    alert("Profile save nahi hui ❤️\n" + error.message);

    return false;

  }

}

// ❤️ Rabta Profile Photo: Cloudinary Upload
if(
  photoInput &&
  photoInput.files &&
  photoInput.files.length > 0
){

  try {

    const photoFile = photoInput.files[0];

    // ❤️ Photo Cloudinary par upload karo
    const uploadResult =
      await window.rabtaUploadMediaToCloudinary(
        photoFile,
        "image"
      );

    if(
  !uploadResult ||
  !uploadResult.success ||
  !uploadResult.mediaUrl
){
  throw new Error("Cloudinary se photo URL nahi mila.");
}

// Photo URL Firebase profile data mein rakho
profileData.photo = uploadResult.mediaUrl;
profileData.profilePhoto = uploadResult.mediaUrl;

// Firebase mein profile save karo
await finishProfileSave();

  } catch(error) {

    console.error(
      "Rabta Profile Photo Upload Error:",
      error
    );

    alert(
      "Bhai, profile photo upload nahi hui ❤️\n\n" +
      (error.message || String(error))
    );

  }

}else{

  await finishProfileSave();

}

}

async function shareMyProfile(){

  const user = window.rabtaAuth.currentUser;

  if(!user){
    alert("Pehle Rabta mein login karo ❤️");
    return;
  }

  try{

    // Private profile Firebase se
    const userDoc = await getDoc(
      doc(window.rabtaDB, "users", user.uid)
    );

    // Public profile Firebase se
    const publicDoc = await getDoc(
      doc(window.rabtaDB, "publicProfiles", user.uid)
    );

    const p = userDoc.exists()
      ? (userDoc.data().profile || {})
      : {};

    const publicData = publicDoc.exists()
      ? publicDoc.data()
      : {};

    const name = p.name || publicData.name || "";
    const age = p.age || publicData.age || "";
    const city = p.city || publicData.city || "";
    const bio = p.bio || publicData.bio || "";

    const interests =
      p.interests || publicData.interests || "";

    const gender =
      p.gender || publicData.gender || "";

    const lookingFor =
      p.lookingFor || publicData.lookingFor || "";

    const vibes = Array.isArray(p.vibes)
      ? p.vibes
      : (Array.isArray(publicData.vibes)
          ? publicData.vibes
          : []);

    const photo =
      publicData.photo ||
      publicData.profilePhoto ||
      p.photo ||
      p.profilePhoto ||
      "";

    if(!name){
      alert("Pehle apna profile name add karo ❤️");
      return;
    }

    const shareText =
      "❤️ Rabta Profile\n\n" +
      "👤 " + name + (age ? ", " + age : "") + "\n" +
      "📍 " + (city || "Not added") + "\n" +
      "📝 " + (bio || "Not added") + "\n" +
      "❤️ Interests: " + (interests || "Not added") + "\n" +
      "👤 Gender: " + (gender || "Not added") + "\n" +
      "💕 Looking For: " + (lookingFor || "Not added") + "\n" +
      "✨ Vibes: " +
      (vibes.length ? vibes.join(", ") : "Not added") +
      "\n\n📱 Shared from Rabta ❤️";

    if(!navigator.share){

      if(navigator.clipboard){
        await navigator.clipboard.writeText(shareText);
        alert("Profile details copy ho gaye ❤️");
      }else{
        alert(shareText);
      }

      return;
    }

    if(!photo){

      await navigator.share({
        title: "❤️ " + name + " - Rabta Profile",
        text: shareText
      });

      return;
    }

    const response = await fetch(photo);

    if(!response.ok){
      throw new Error("Profile photo download nahi hui.");
    }

    const blob = await response.blob();

    const file = new File(
      [blob],
      name.replace(/[^a-zA-Z0-9]/g, "_") +
      "_Rabta_Profile.jpg",
      {
        type: blob.type || "image/jpeg"
      }
    );

    if(
      navigator.canShare &&
      navigator.canShare({files:[file]})
    ){

      await navigator.share({
        title: "❤️ " + name + " - Rabta Profile",
        text: shareText,
        files: [file]
      });

    }else{

      await navigator.share({
        title: "❤️ " + name + " - Rabta Profile",
        text: shareText
      });

    }

  }catch(error){

    console.error("Rabta Profile Share Error:", error);

    if(error.name !== "AbortError"){
      alert(
        "Profile share nahi ho payi ❤️\n" +
        (error.message || String(error))
      );
    }

  }

}

  // ❤️ Rabta Firebase Profile Visibility Toggle
async function toggleProfileVisibility(){

  const user = window.rabtaAuth.currentUser;

  if(!user){
    alert("Pehle Rabta mein login karo ❤️");
    return;
  }

  try{

    const publicRef = window.rabtaFirebaseDoc(
      window.rabtaDB,
      "publicProfiles",
      user.uid
    );

    const privateRef = window.rabtaFirebaseDoc(
      window.rabtaDB,
      "users",
      user.uid
    );

    const publicDoc = await await window.rabtaFirebaseGetDoc(publicRef);
    const privateDoc = await window.rabtaFirebaseGetDoc(privateRef);

    const publicData = publicDoc.exists()
      ? publicDoc.data()
      : {};

    const privateData = privateDoc.exists()
      ? privateDoc.data()
      : {};

    const currentVisible =
      publicData.profileVisible !== undefined
        ? publicData.profileVisible !== false &&
          publicData.profileVisible !== "off"
        : privateData.profileVisible !== false &&
          privateData.profileVisible !== "off";

    const newVisible = !currentVisible;

    await window.rabtaFirebaseSetDoc(
      publicRef,
      {
        uid: user.uid,
        profileVisible: newVisible,
        updatedAt: new Date().toISOString()
      },
      { merge: true }
    );

    await window.rabtaFirebaseSetDoc(
      privateRef,
      {
        profileVisible: newVisible,
        updatedAt: new Date().toISOString()
      },
      { merge: true }
    );

    localStorage.setItem(
      "profileVisible",
      newVisible ? "on" : "off"
    );

    alert(
      newVisible
        ? "👁️ Profile ab Discover mein visible hai!"
        : "🙈 Profile ab Discover mein hidden hai!"
    );

    privacySettings();

  }catch(error){

    console.error("Rabta Visibility Error:", error);

    alert(
      "Visibility update nahi hui ❤️\n" +
      (error.message || error)
    );

  }

}

      </div>

        Loading Messages...
      </div>

    </div>
  `;

  try{

    const messagesRef =
      window.rabtaFirebaseCollection(
        window.rabtaDB,
        "supportMessages"
      );

    const snapshot =
      await window.rabtaFirebaseGetDocs(messagesRef);

    const box =
      document.getElementById("rabtaAdminMessages");

    if(!box) return;

    if(snapshot.empty){
      box.innerHTML = `
        <div style="
          text-align:center;

        ">

        </div>

      return;
    }

    const userChats = {};

    snapshot.docs.forEach(function(doc){

      const data = doc.data();

      const uid = data.userUid;

      if(!uid) return;

      if(!userChats[uid]){
        userChats[uid] = {
          uid: uid,
          name: data.userName || "Rabta User",
          messages: []
        };
      }

      userChats[uid].messages.push({
        id: doc.id,
        message: data.message || "",
        createdAt: Number(data.createdAt || 0)
      });

    });

    // ❤️ Latest message sabse upar

      });

      );

          day:"2-digit",
          month:"short",
          hour:"2-digit",
          minute:"2-digit"
        }
      );

    };

    box.innerHTML = chatUsers.map(function(chat){

        return p.uid === chat.uid;

window.rabtaUploadMediaToCloudinary = async function(
  file,

  customFolder,
  customFileName
){

  try {

    if(!file){
      throw new Error("Upload ke liye media file nahi mili.");
    }

    const cloudName = "ydlgh3qf";
    const uploadPreset = "rabta_story_upload";

    const type = String(mediaType || "image").toLowerCase();

  (type === "video" || type === "audio")
    ? "video"
    : "image";

      "https://api.cloudinary.com/v1_1/" +
      cloudName + "/" + resourceType + "/upload";

    const formData = new FormData();

    // ❤️ Custom filename support
if(type === "audio"){

  formData.append(
    "file",

  );

      : "rabta_stories"
  )
);

    const response = await fetch(uploadURL, {
      method: "POST",
      body: formData
    });

    const result = await response.json();

        result.error?.message || "Cloudinary upload fail ho gaya."
      );
    }

    return {
      success: true,
      mediaUrl: result.secure_url,
      publicId: result.public_id,
      resourceType: result.resource_type
    };

window.rabtaAddContentComment = async function(
  type,
  contentId,
  commentText
){

    const user = window.rabtaAuth.currentUser;

    if(!user){
      throw new Error("Pehle login karo.");
    }

    const text = String(commentText || "").trim();

    if(!text){
      throw new Error("Comment khaali nahi ho sakta.");
    }

    if(text.length > 500){
      throw new Error("Comment 500 characters se chhota rakho.");
    }

    const collectionName =
      type === "reel" ? "reels" : "posts";

    const userInfo =
      await window.rabtaGetSocialUserInfo(user.uid);

    const commentsRef = window.rabtaFirebaseCollection(
      window.rabtaDB,

      contentId,
      "comments"
    );

        const savedComment =
      await window.rabtaFirebaseAddDoc(commentsRef, {

        senderUid: user.uid,
        senderName: userInfo.name,
        senderPhoto: userInfo.photo,
        text: text,
        createdAt: Date.now()

      });

    // ❤️ Comment Notification

      savedComment.id
    );

    };

    console.error("Rabta Comment Error:", error);
    throw error;

  }

// 💬 Load Post/Reel Comments
window.rabtaLoadContentComments = async function(type, contentId){

  try {

    const collectionName =
      type === "reel" ? "reels" : "posts";

    const commentsRef = window.rabtaFirebaseCollection(
      window.rabtaDB,
      collectionName,
      contentId,
      "comments"
    );

    const snapshot =
      await window.rabtaFirebaseGetDocs(commentsRef);

    const comments = snapshot.docs.map(function(doc){

      return {
        id: doc.id,
        ...doc.data()
      };

    });

    comments.sort(function(a, b){
      return Number(a.createdAt || 0) -
             Number(b.createdAt || 0);
    });

    return comments;

  } catch(error) {

    console.error("Rabta Comments Load Error:", error);
    throw error;

  }

};

  // ❤️ Rabta Post/Reel Waveform + Music Trim
window.rabtaInitPostReelMusicEditor = function(){

  const player =
    editor.querySelector("#rabtaPostMusicPlayer");

  const waveform =
    editor.querySelector("#rabtaPostMusicWaveform");

  const bars =
    editor.querySelector("#rabtaPostWaveformBars");

  const selection =
    editor.querySelector("#rabtaPostWaveformSelection");

  // ❤️ Rabta Music Moving Playhead
let playhead =
  selection.querySelector("#rabtaPostMusicPlayhead");

if(!playhead){

  playhead = document.createElement("div");

  playhead.id = "rabtaPostMusicPlayhead";

  playhead.style.cssText = `
    position:absolute;
    top:0;
    bottom:0;
    left:0%;
    width:3px;
    background:#ffffff;
    border:1px solid #ff1744;
    border-radius:5px;
    z-index:999;
    pointer-events:none;
  `;

  selection.appendChild(playhead);

  }
  
  const playButton =
    editor.querySelector("#rabtaPostTrimPlayPause");

  const startLabel =
    editor.querySelector("#rabtaPostMusicStartLabel");

  const clipLabel =
    editor.querySelector("#rabtaPostTimelineDuration");

  const durationValue =
    editor.querySelector("#rabtaPostMusicDurationValue");

  const trimPanel =
    editor.querySelector("#rabtaPostMusicTrimPanel");

  if(!player || !waveform || !bars || !selection || !playButton){
    console.log("Rabta Post Music elements missing.");
    return;
  }

  if(!rabtaPostMusicURL) return;

  trimPanel.style.display = "none";

  player.src = rabtaPostMusicURL;
  player.load();

  let audioDuration = 0;
  let startTime = Number(rabtaPostMusicStartTime || 0);
  let clipDuration = Number(rabtaPostMusicDuration || 15);
  let dragging = false;
  let pointerOffset = 0;
  let animationFrame = null;
  let clipEndTime = 0;

  // ❤️ Rabta Mobile Touch Support
waveform.style.touchAction = "none";
selection.style.touchAction = "none";

waveform.style.userSelect = "none";
selection.style.userSelect = "none";

waveform.style.webkitUserSelect = "none";
selection.style.webkitUserSelect = "none";
  
  // ❤️ Waveform Bars
  bars.innerHTML = "";

  for(let i = 0; i < 64; i++){

    const bar = document.createElement("div");

    const height = 10 + Math.round(
      Math.abs(Math.sin(i * 1.73) * Math.cos(i * 0.41)) * 48
    );

    bar.style.cssText =
      "flex:1;min-width:2px;max-width:5px;" +
      "height:" + height + "px;" +
      "border-radius:4px;background:#ff80ab;";

    bars.appendChild(bar);

  }

  // ❤️ Update Trim Selection
  function updateTrim(){

    if(!audioDuration) return;

    clipDuration = Math.max(
      Math.min(5,audioDuration),
      Math.min(clipDuration,audioDuration)
    );

    startTime = Math.max(
      0,
      Math.min(startTime,audioDuration-clipDuration)
    );

    selection.style.left =
      (startTime/audioDuration*100) + "%";

    selection.style.width =
      Math.max(5,clipDuration/audioDuration*100) + "%";

    startLabel.textContent =
      "Start: " + startTime.toFixed(1) + " seconds";

    clipLabel.textContent =
      "Clip: " + Math.round(clipDuration) + "s";

    durationValue.textContent =
      Math.round(clipDuration) + " sec";

    rabtaPostMusicStartTime = startTime;
    rabtaPostMusicDuration = clipDuration;

    // ❤️ Save Selected Music Trim Details
window.rabtaPostMusicTrimData = {
  startTime: rabtaPostMusicStartTime,
  duration: rabtaPostMusicDuration,
  songName: rabtaPostMusicName
};

console.log(
  "Rabta Music Trim Saved:",
  window.rabtaPostMusicTrimData
);
    
  }

  // ❤️ Audio Metadata + Auto Play
player.onloadedmetadata = function(){

  audioDuration = player.duration;

  if(!Number.isFinite(audioDuration) || audioDuration <= 0){
    return;
  }

  clipDuration = Math.min(
    Math.max(5,clipDuration),
    audioDuration
  );

  updateTrim();

  // ❤️ Selected song automatically play
  startTime = Math.max(
    0,
    Math.min(startTime,audioDuration-clipDuration)
  );

  player.currentTime = startTime;

  clipEndTime = startTime + clipDuration;

  player.play().then(function(){

    playButton.textContent = "❚❚";

    animationFrame =
      requestAnimationFrame(animatePlayhead);

  }).catch(function(error){

    console.log("Rabta Auto Play:",error);

  });

};

  // ❤️ Finger se Trim Box Move
  selection.onpointerdown = function(event){

    dragging = true;

    const rect = selection.getBoundingClientRect();

    pointerOffset = event.clientX - rect.left;

    try{
      selection.setPointerCapture(event.pointerId);
    }catch(error){}

    event.preventDefault();

  };

  selection.onpointermove = function(event){

    if(!dragging || !audioDuration) return;

    const rect = waveform.getBoundingClientRect();

    const boxWidth = selection.getBoundingClientRect().width;

    let left = event.clientX - rect.left - pointerOffset;

    left = Math.max(0,Math.min(left,rect.width-boxWidth));

    startTime =
      (left/rect.width)*(audioDuration);

    updateTrim();

    event.preventDefault();

  };

  function stopDragging(){

  dragging = false;

  if(!audioDuration || !player) return;

  // ❤️ Purana preview band karo
  player.pause();

  if(animationFrame !== null){
    cancelAnimationFrame(animationFrame);
    animationFrame = null;
  }

  // ❤️ Naye selected point se turant play
  player.currentTime = startTime;

  clipEndTime = Math.min(
    startTime + clipDuration,
    audioDuration
  );

  if(playhead){
    playhead.style.left = "0%";
  }

  player.play().then(function(){

    playButton.textContent = "❚❚";

    animationFrame =
      requestAnimationFrame(animatePlayhead);

  }).catch(function(error){

    console.log("Rabta Clip Preview:", error);

  });

  }

  selection.onpointerup = stopDragging;
  selection.onpointercancel = stopDragging;

  // ❤️ Duration 5 to 30 Seconds
  durationValue.onclick = function(){

    if(!audioDuration) return;

    let maxSeconds = Math.min(30,audioDuration);

    let minimum = Math.min(5,maxSeconds);

    let next = Math.round(clipDuration)+1;

    if(next > maxSeconds){
      next = minimum;
    }

    clipDuration = next;

    if(!player.paused){
      player.pause();
    }

    if(animationFrame !== null){
      cancelAnimationFrame(animationFrame);
      animationFrame = null;
    }

    playButton.textContent = "▶";

    updateTrim();

  };

  // ❤️ Playhead Animation
  function animatePlayhead(){

    if(player.paused){
      animationFrame = null;
      return;
    }

    let progress =
      (player.currentTime-startTime)/clipDuration;

    progress = Math.max(0,Math.min(1,progress));

    // ❤️ Moving Playhead Position
if(playhead){
  playhead.style.left =
    (progress * 100) + "%";
}
    
    selection.style.setProperty(
      "--rabta-progress",
      (progress*100)+"%"
    );

    if(player.currentTime >= clipEndTime){

  player.pause();

  player.currentTime = clipEndTime;

  if(playhead){
    playhead.style.left = "100%";
  }

  selection.style.setProperty(
    "--rabta-progress",
    "100%"
  );

  playButton.textContent = "▶";

  animationFrame = null;

  return;

    }

    animationFrame =
      requestAnimationFrame(animatePlayhead);

  }

  // ❤️ Play / Pause
  playButton.onclick = async function(event){

    event.preventDefault();

    if(!audioDuration){
      alert("Music abhi load ho raha hai. Thoda wait karo.");
      return;
    }

    if(!player.paused){

      player.pause();

      if(animationFrame !== null){
        cancelAnimationFrame(animationFrame);
        animationFrame = null;
      }

      playButton.textContent = "▶";

      return;

    }

    try{

      player.currentTime = startTime;

      clipEndTime = Math.min(
        startTime+clipDuration,
        audioDuration
      );

      await player.play();

      playButton.textContent = "❚❚";

      animationFrame =
        requestAnimationFrame(animatePlayhead);

    }catch(error){

      console.error("Rabta Post Music Preview:",error);

      alert("Music preview play nahi ho pa raha.");

    }

  };

  player.onpause = function(){

    playButton.textContent = "▶";

  
    
    if(animationFrame !== null){
      cancelAnimationFrame(animationFrame);
      animationFrame = null;
    }

  };

    updateTrim();



  console.log("Rabta Post/Reel Waveform Editor ready.");

};
